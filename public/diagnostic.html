<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BarCarila Chat Diagnostic</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#0b0b0b;color:#eee;padding:20px;line-height:1.6}button{font-size:16px;padding:12px 18px}pre{white-space:pre-wrap;word-break:break-word;background:#171717;padding:14px;border-radius:8px}</style></head><body><h1>BarCarila Chat Diagnostic</h1><p>本番環境から /api/chat へ最小の Sonnet 5 リクエストを送ります。APIキー等の秘密情報は表示しません。</p><button id="run">診断を実行</button><pre id="out">未実行</pre><script>document.getElementById('run').onclick=async()=>{const out=document.getElementById('out');out.textContent='実行中…';const started=Date.now();try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-5',max_tokens:300,system:'Return exactly this JSON object and nothing else: {"type":"recommendation","message":"ok","drink":{"name":"Gin and Tonic","masterKey":"Gin and Tonic","category":"cocktail","abv":"10%","recipe":"test","tags":["test"]}}',messages:[{role:'user',content:'test'}]})});const text=await res.text();out.textContent=`HTTP ${res.status}\n${Date.now()-started} ms\n\n${text}`;}catch(e){out.textContent=`NETWORK ERROR\n${e&&e.message?e.message:String(e)}`;}};</script></body></html>
