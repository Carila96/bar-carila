<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BarCarila Final Recommendation Diagnostic</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#0b0b0b;color:#eee;padding:20px;line-height:1.6;max-width:900px;margin:auto}button{font-size:16px;padding:12px 18px}pre{white-space:pre-wrap;word-break:break-word;background:#171717;padding:14px;border-radius:8px}.ok{color:#8fda8f}.ng{color:#ff9a9a}.muted{color:#aaa}.case{margin:18px 0;padding:12px;border:1px solid #333;border-radius:8px}
</style>
</head>
<body>
<h1>BarCarila 最終推薦診断</h1>
<p>本番と同じ <code>/api/chat</code> に4種類のリクエストを順番に送ります。APIキー等の秘密情報は表示しません。完了まで20〜40秒程度かかる場合があります。</p>
<button id="run">4段階診断を実行</button>
<div id="out"><p class="muted">未実行</p></div>
<script>
const MIN_SYSTEM='Return one JSON object only. It must be a recommendation for Gin and Tonic with type, message, and drink fields. drink must include name, masterKey, category, abv, recipe, and tags.';
const initialQuestion={type:'question',emotion:'counter',message:'いらっしゃいませ。……今夜は、どんなお酒をお探しですか？',choices:['おすすめを聞かせて','カクテルを探したい','ウイスキー・洋酒を探したい','ノンアルでも楽しみたい']};
const q1={type:'question',emotion:'think',message:'まず、アルコールの強さはどのくらいがよいですか？',choices:['ほぼ飲めない・ノンアルがいい','ビール・チューハイくらい','ワインや焼酎くらい（12〜25%程度）','ウイスキーのストレートも平気（40%前後）']};
const q2={type:'question',emotion:'think',message:'今夜はどんな味のイメージですか？',choices:['甘め・まろやか','さっぱり・軽やか','濃いめ・どっしり','癖のある個性的なもの']};
const q3={type:'question',emotion:'think',message:'今夜はどんな夜ですか？',choices:['ゆったりリラックスしたい','特別な夜を楽しみたい','少し冒険してみたい','定番の安心感がほしい']};
const MIN_MESSAGES=[{role:'user',content:'test'}];
const GUIDED_MESSAGES=[
  {role:'user',content:'こんばんは。今夜のお酒を選んでほしいです。'},
  {role:'assistant',content:JSON.stringify(initialQuestion)},
  {role:'user',content:'おすすめを聞かせて'},
  {role:'assistant',content:JSON.stringify(q1)},
  {role:'user',content:'ビール・チューハイくらい'},
  {role:'assistant',content:JSON.stringify(q2)},
  {role:'user',content:'さっぱり・軽やか'},
  {role:'assistant',content:JSON.stringify(q3)},
  {role:'user',content:'ゆったりリラックスしたい'}
];
function parseInner(data){
  const blocks=Array.isArray(data&&data.content)?data.content:[];
  const block=blocks.find(b=>b&&b.type==='text'&&typeof b.text==='string')||blocks.find(b=>b&&typeof b.text==='string');
  if(!block)return {ok:false,error:'text blockなし'};
  const cleaned=block.text.replace(/```json|```/g,'').trim();
  try{return {ok:true,value:JSON.parse(cleaned)}}catch(e){}
  const first=cleaned.indexOf('{'),last=cleaned.lastIndexOf('}');
  if(first>=0&&last>first){try{return {ok:true,value:JSON.parse(cleaned.slice(first,last+1))}}catch(e){}}
  return {ok:false,error:'inner JSON parse失敗',text:cleaned.slice(0,800)};
}
async function loadFullSystem(){
  const res=await fetch('/assets/js/main.js',{cache:'no-store'});
  if(!res.ok)throw new Error(`main.js取得失敗 HTTP ${res.status}`);
  const source=await res.text();
  const start='const SYSTEM=`';
  const end='`;\n\nconst I18N=';
  const i=source.indexOf(start),j=source.indexOf(end,i+start.length);
  if(i<0||j<0)throw new Error('SYSTEM抽出境界が見つかりません');
  const body=source.slice(i+start.length,j);
  try{return Function('return `'+body+'`;')()}catch(e){throw new Error('SYSTEM評価失敗: '+e.message)}
}
async function runCase(name,system,messages,maxTokens){
  const started=performance.now();
  let status='NETWORK',text='';
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-5',max_tokens:maxTokens,system,messages})});
    status=String(res.status);text=await res.text();
  }catch(e){return {name,http:status,ms:Math.round(performance.now()-started),ok:false,error:e.message}}
  const result={name,http:status,ms:Math.round(performance.now()-started),ok:false};
  let data;
  try{data=JSON.parse(text)}catch(e){result.error='outer JSON parse失敗';result.raw=text.slice(0,1200);return result}
  result.code=data.code||null;result.requestId=data.requestId||null;result.detail=data.detail||null;result.stopReason=data.stop_reason||null;result.usage=data.usage||null;
  if(status!=='200'){result.error=data.error||'HTTP error';result.raw=text.slice(0,1200);return result}
  const inner=parseInner(data);
  if(!inner.ok){result.error=inner.error;result.raw=inner.text||text.slice(0,1200);return result}
  result.type=inner.value&&inner.value.type;result.drink=inner.value&&inner.value.drink&&inner.value.drink.name;result.masterSource=inner.value&&inner.value.drink&&inner.value.drink.masterSource;
  result.ok=result.type==='recommendation'&&!!result.drink;
  if(!result.ok)result.error='HTTP 200だが recommendation ではない';
  return result;
}
function render(results,systemLength){
  const out=document.getElementById('out');out.innerHTML='';
  const meta=document.createElement('p');meta.className='muted';meta.textContent=`本番SYSTEM文字数: ${systemLength}`;out.appendChild(meta);
  for(const r of results){
    const box=document.createElement('div');box.className='case';
    const h=document.createElement('strong');h.className=r.ok?'ok':'ng';h.textContent=`${r.ok?'PASS':'FAIL'}: ${r.name}`;box.appendChild(h);
    const pre=document.createElement('pre');pre.textContent=JSON.stringify(r,null,2);box.appendChild(pre);out.appendChild(box);
  }
}
document.getElementById('run').onclick=async()=>{
  const btn=document.getElementById('run'),out=document.getElementById('out');btn.disabled=true;out.innerHTML='<p>main.jsから本番SYSTEMを取得中…</p>';
  try{
    const fullSystem=await loadFullSystem();
    const cases=[
      ['A 最小SYSTEM + 最小履歴',MIN_SYSTEM,MIN_MESSAGES,300],
      ['B 本番SYSTEM + 最小履歴',fullSystem,MIN_MESSAGES,2200],
      ['C 最小SYSTEM + 実際の選択式履歴',MIN_SYSTEM,GUIDED_MESSAGES,2200],
      ['D 本番SYSTEM + 実際の選択式履歴（本番相当）',fullSystem,GUIDED_MESSAGES,2200]
    ];
    const results=[];
    for(const c of cases){out.innerHTML=`<p>実行中: ${c[0]} (${results.length+1}/4)</p>`;results.push(await runCase(...c))}
    render(results,fullSystem.length);
  }catch(e){out.innerHTML='';const pre=document.createElement('pre');pre.className='ng';pre.textContent='DIAGNOSTIC ERROR\n'+e.message;out.appendChild(pre)}finally{btn.disabled=false}
};
</script>
</body>
</html>
