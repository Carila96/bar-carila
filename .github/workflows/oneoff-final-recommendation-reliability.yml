name: One-off final recommendation reliability patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make final recommendation parsing robust
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('public/assets/js/main.js')
          s = p.read_text(encoding='utf-8')

          old = "  const maxTokens=fastTurn?600:1000;"
          new = "  const maxTokens=fastTurn?600:1400;"
          if old not in s:
              raise SystemExit('maxTokens anchor not found')
          s = s.replace(old, new, 1)

          old = "  const data=await readAPIResponse(res);\n  const text=data.content[0].text;\n  chatHistory.push({role:'assistant',content:text});\n  return JSON.parse(text.replace(/```json|```/g,'').trim());"
          new = "  const data=await readAPIResponse(res);\n  const parsed=parseAssistantJson(data);\n  chatHistory.push({role:'assistant',content:JSON.stringify(parsed)});\n  return parsed;"
          if old not in s:
              raise SystemExit('callAPI parse anchor not found')
          s = s.replace(old, new, 1)

          anchor = "async function readAPIResponse(res){\n"
          if anchor not in s:
              raise SystemExit('readAPIResponse anchor not found')
          helper = r'''function parseAssistantJson(data){
  const blocks=Array.isArray(data&&data.content)?data.content:[];
  const textBlock=blocks.find(b=>b&&b.type==='text'&&typeof b.text==='string')||blocks.find(b=>b&&typeof b.text==='string');
  if(!textBlock)throw new Error('Chat API returned no text block');
  let text=textBlock.text.replace(/```json|```/g,'').trim();
  try{return JSON.parse(text);}catch{}
  const first=text.indexOf('{'),last=text.lastIndexOf('}');
  if(first>=0&&last>first){
    text=text.slice(first,last+1);
    return JSON.parse(text);
  }
  throw new Error('Chat API returned malformed recommendation JSON');
}

'''
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s, encoding='utf-8')

          tp=Path('test/worker.test.mjs')
          t=tp.read_text(encoding='utf-8')
          marker="test('drink image fails safely when its secret is missing'"
          if marker not in t:
              raise SystemExit('test marker not found')
          extra=r'''test('final recommendation parser tolerates non-text blocks and JSON wrappers', async () => {
  const html = await readFile(new URL('../public/assets/js/main.js', import.meta.url), 'utf8');
  assert.match(html, /function parseAssistantJson\(data\)/);
  assert.match(html, /blocks\.find\(b=>b&&b\.type==='text'/);
  assert.match(html, /const first=text\.indexOf\('\{'\),last=text\.lastIndexOf\('\}'\)/);
  assert.match(html, /const maxTokens=fastTurn\?600:1400/);
  assert.doesNotMatch(html, /data\.content\[0\]\.text/);
});

'''
          if "final recommendation parser tolerates non-text blocks" not in t:
              t=t.replace(marker,extra+marker,1)
          tp.write_text(t,encoding='utf-8')
          PY
      - name: Commit patch and remove one-off files
        run: |
          rm -f .github/workflows/oneoff-final-recommendation-reliability.yml docs/.final-recommendation-fix-plan
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/main.js test/worker.test.mjs .github/workflows/oneoff-final-recommendation-reliability.yml docs/.final-recommendation-fix-plan
          git commit -m "Harden final recommendation response parsing"
          git push origin HEAD:main
