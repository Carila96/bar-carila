name: One-off fade and model benchmark
on:
  push:
    branches: [ux/slower-choice-fade-benchmark]
permissions:
  contents: write
jobs:
  patch-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/slower-choice-fade-benchmark
      - name: Refine guided choice fade-in
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('public/assets/css/main.css')
          s=css.read_text(encoding='utf-8')
          old=".choices{display:flex;flex-direction:column;gap:7px;margin-bottom:8px;animation:fadeUp 0.35s ease both;transition:opacity 0.18s ease-out,transform 0.18s ease-out;}"
          new=".choices{display:flex;flex-direction:column;gap:7px;margin-bottom:8px;animation:choiceFadeIn 0.8s cubic-bezier(.22,.61,.36,1) both;transition:opacity 0.18s ease-out,transform 0.18s ease-out;}"
          if old not in s:
            raise SystemExit('choices animation anchor missing')
          s=s.replace(old,new,1)
          marker='@keyframes dotPulse{'
          if marker not in s:
            raise SystemExit('keyframe anchor missing')
          s=s.replace(marker,'@keyframes choiceFadeIn{0%{opacity:0;transform:translateY(2px);}100%{opacity:1;transform:translateY(0);}}\n'+marker,1)
          css.write_text(s,encoding='utf-8')
          test=Path('test/worker.test.mjs')
          t=test.read_text(encoding='utf-8')
          anchor="test('guided flow uses a visible fade transition and a compact final-only prompt'"
          if anchor in t and 'choiceFadeIn 0.8s' not in t:
            idx=t.find(anchor)
            end=t.find('});', idx)
            if end!=-1:
              insert="\n  const css = await readFile(new URL('../public/assets/css/main.css', import.meta.url), 'utf8');\n  assert.match(css, /animation:choiceFadeIn 0\\.8s/);\n"
              t=t[:end]+insert+t[end:]
              test.write_text(t,encoding='utf-8')
          PY
      - name: Test
        run: |
          npm ci
          npm test
          npm run validate:drink-master-v1.9
      - name: Benchmark Sonnet 5 vs Haiku 4.5 on production endpoint
        shell: bash
        run: |
          node <<'NODE'
          const endpoint='https://bar.carilaworks.com/api/chat';
          const system=`あなたはBarCarilaのバーテンダーです。ユーザーの回答から今夜の一杯を1つだけ選んでください。日本のBARで実際に注文する入口になる提案を優先します。JSON以外は出力しないでください。\n形式:{"type":"recommendation","message":"80字以内","analysis":"1行80字以内","expression":"smile","drink":{"name":"正式名称","masterKey":"標準的な英語名","imageQuery":"写真検索用の英語8語以内。色・グラス・主要材料・見た目を表す","category":"カテゴリ","abv":"約8%","rarity":0,"description":"60字以内","trivia":"80字以内","recipe":{"ingredients":[{"name":"材料","amount":"分量"}],"method":"作り方1文"},"tags":["タグ1","タグ2","タグ3"]}}`;
          const user=`今夜の一杯を提案してください。\nルート: 特別な夜\n回答:\n- 気分: 華やかに過ごしたい\n- 味: 甘すぎず爽やか\n- 度数: ほどほど\n- BARで注文しやすいものを優先`;
          async function one(model){
            const started=performance.now();
            const res=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model,max_tokens:850,system,messages:[{role:'user',content:user}]})});
            const elapsed=performance.now()-started;
            const body=await res.text();
            let drink=''; let text=''; let stop=''; let usage={};
            try{
              const data=JSON.parse(body); stop=data.stop_reason||''; usage=data.usage||{};
              text=(data.content||[]).find(x=>x&&x.type==='text')?.text||'';
              try{drink=JSON.parse(text.replace(/```json|```/g,'').trim())?.drink?.name||'';}catch{}
            }catch{}
            return {model,status:res.status,ms:Math.round(elapsed),drink,stop,usage,text};
          }
          const models=['claude-sonnet-5','claude-haiku-4-5-20251001'];
          const results=[];
          for(let i=0;i<3;i++) for(const m of models){
            const r=await one(m); results.push(r);
            console.log(`RUN ${i+1} ${m}: ${r.ms}ms HTTP ${r.status} drink=${r.drink} stop=${r.stop}`);
            console.log(`OUTPUT ${m}: ${r.text}`);
          }
          for(const m of models){
            const xs=results.filter(r=>r.model===m).map(r=>r.ms).sort((a,b)=>a-b);
            const avg=Math.round(xs.reduce((a,b)=>a+b,0)/xs.length);
            console.log(`SUMMARY ${m}: min=${xs[0]}ms median=${xs[Math.floor(xs.length/2)]}ms avg=${avg}ms max=${xs[xs.length-1]}ms`);
          }
          NODE
      - name: Commit clean fade patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-fade-benchmark.yml
          git add public/assets/css/main.css test/worker.test.mjs
          git commit -m 'Slow guided choice fade-in'
          git push origin HEAD:ux/slower-choice-fade-benchmark
