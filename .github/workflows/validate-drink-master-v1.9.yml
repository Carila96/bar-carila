name: Validate drink master v1.9

on:
  pull_request:
  push:
    branches:
      - research/jp-rarity-v1.9-working

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate:drink-master-v1.9
