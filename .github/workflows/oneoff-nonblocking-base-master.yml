name: One-off nonblocking base master read
"on":
  push:
    branches:
      - "perf/nonblocking-base-master-read"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "perf/nonblocking-base-master-read"
      - name: Keep base drink-master maintenance off recommendation path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/worker.mjs')
          s=p.read_text(encoding='utf-8')
          old="""async function readDrinkMaster(env, name) {
  if (!name || !await ensureDrinkMasterTables(env)) return null;"""
          new="""async function readDrinkMaster(env, name, ensureReady = true) {
  if (!name || !env?.DRINK_DB) return null;
  if (ensureReady && !await ensureDrinkMasterTables(env)) return null;"""
          if old not in s: raise SystemExit('readDrinkMaster anchor missing')
          s=s.replace(old,new,1)
          old2="try { row = await readDrinkMaster(env, parsed.drink.name); } catch (error) {"
          new2="try { row = await readDrinkMaster(env, parsed.drink.name, false); } catch (error) {"
          if old2 not in s: raise SystemExit('enrichment read anchor missing')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          p=Path('test/worker.test.mjs')
          s=p.read_text(encoding='utf-8')
          marker="test('frontend routes quick turns to Ha"
          insert="""test('recommendation enrichment does not run drink-master schema maintenance after Sonnet', async () => {
  const source = await readFile(new URL('../src/worker.mjs', import.meta.url), 'utf8');
  assert.match(source, /readDrinkMaster\(env, parsed\.drink\.name, false\)/);
  assert.match(source, /async function readDrinkMaster\(env, name, ensureReady = true\)/);
});

"""
          if insert.strip() not in s:
              idx=s.find(marker)
              if idx < 0: raise SystemExit('test insertion marker missing')
              s=s[:idx]+insert+s[idx:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Test
        shell: bash
        run: |
          npm ci
          npm test
          npm run validate:drink-master-v1.9
      - name: Commit clean patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-nonblocking-base-master.yml
          git add -A
          git commit -m 'Avoid drink-master maintenance on recommendation response'
          git push origin HEAD:perf/nonblocking-base-master-read
