name: Apply rarity v1.5
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch calibrated seed
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='src/worker.mjs';
          let s=fs.readFileSync(p,'utf8');
          const reps=[
            ['["フレンチ75",64,36,"やや珍しい",0.84,"国内提供例はあるがスパークリング常備店に寄りやすい。"]','["フレンチ75",66,34,"やや珍しい",0.87,"国内のホテルBARから一般BARまで提供例があり、スパークリング常備店では成立しやすい。"]'],
            ['["ラスティネイル",62,38,"やや珍しい",0.8,"クラシックだがドランブイ常備の有無に左右される。"]','["ラスティネイル",65,35,"やや珍しい",0.86,"国内の現行BARで複数提供例があるが、ドランブイ常備の有無で店差が出る。"]'],
            ['["ゴッドファーザー",62,38,"やや珍しい",0.8,"認知はあるがアマレット常備の有無で店差が出る。"]','["ゴッドファーザー",68,32,"やや珍しい",0.88,"国内の複数業態で現行提供例があり、材料と技法も比較的シンプル。"]'],
            ['["ロブロイ",60,40,"やや珍しい",0.78,"クラシックだが日本一般BARでの注文頻度は高くない。"]','["ロブロイ",63,37,"やや珍しい",0.83,"クラシックとして国内提供例があり、材料も専門BARでは揃いやすい。"]'],
            ['["ブロンクス",57,43,"やや珍しい",0.77,"クラシックだが現代日本の一般BARでは頻度が低め。"]','["ブロンクス",62,38,"やや珍しい",0.82,"国内の現行BARでクラシックとして提供例があり、材料・技法上は成立しやすい。"]'],
            ['["パローマ",52,48,"やや珍しい",0.76,"世界では定番だが日本一般BARではテキーラ系材料の常備に店差がある。"]','["パローマ",64,36,"やや珍しい",0.86,"国内のホテルBARやダイニングBAR等で現行提供が広がっており、材料・技法も比較的シンプル。"]'],
            ['["マイタイ",46,54,"珍しい",0.76,"材料数と店のスタイルに依存し一般BARでは店差が大きい。"]','["マイタイ",55,45,"やや珍しい",0.84,"国内BARで現行提供例は複数あるが、レシピ差と副材料の常備で店差が大きい。"]'],
            ['["ピニャコラーダ",45,55,"珍しい",0.76,"ココナッツ系材料や提供スタイルに依存する。"]','["ピニャコラーダ",52,48,"やや珍しい",0.84,"国内BARで現行提供例は複数あるが、ココナッツ系材料や提供スタイルに依存する。"]'],
            ['["サゼラック",36,64,"珍しい",0.72,"クラシックだが材料常備と専門性への依存が大きい。"]','["サゼラック",42,58,"珍しい",0.83,"国内の現行カクテルBARで提供例はあるが、アブサンやペイショーズビターズ等の常備に依存する。"]'],
            ['["コープスリバイバー No.2",34,66,"珍しい",0.78,"国内でも現役だが専門性と材料依存が大きい。"]','["コープスリバイバー No.2",38,62,"珍しい",0.82,"国内の現行BARで提供例はあるが、専門性と複数の特殊材料に依存する。"]'],
            ['["ラモスジンフィズ",26,74,"かなり珍しい",0.74,"材料、技法、提供時間の制約が大きい。"]','["ラモスジンフィズ",32,68,"珍しい",0.84,"国内で複数の現行提供例はあるが、材料数、長いシェイク、提供時間の制約が大きい。"]'],
            ['["ヴューカレ",24,76,"かなり珍しい",0.69,"複数の特殊材料と専門性に依存する。"]','["ヴューカレ",32,68,"珍しい",0.82,"国内で現行提供例はあるが、ライ、コニャック、ベネディクティン、複数ビターズ等の常備に依存する。"]'],
            ['["トリニダードサワー",18,82,"かなり珍しい",0.65,"ビターズを大量使用する特殊な構成で一般BAR標準から遠い。"]','["トリニダードサワー",24,76,"かなり珍しい",0.78,"国内の現行提供例はあるが、ビターズを大量使用する特殊構成で一般BAR標準から遠い。"]']
          ];
          for(const [a,b] of reps){ if(!s.includes(a)) throw new Error('target not found: '+a); s=s.replace(a,b); }
          s=s.replaceAll("'jp-rarity-v1.3'","'jp-rarity-v1.5'");
          const start=s.indexOf("      const countRow = await env.DRINK_DB.prepare('SELECT COUNT(*) AS count FROM drinks').first();");
          const end=s.indexOf('      for (const [name, description, taste, orderHint] of DRINK_COPY_SEED)', start);
          if(start<0||end<0) throw new Error('seed block not found');
          const upsert=`      const statements = DRINK_MASTER_SEED.map(([name, availability, rarity, label, confidence, reason]) => env.DRINK_DB.prepare(\`INSERT INTO drinks (\n          canonical_key, name_ja, japan_availability_score, japan_rarity_score, japan_rarity_label,\n          japan_rarity_confidence, rarity_reason, evidence_version, evaluated_at\n        ) VALUES (?, ?, ?, ?, ?, ?, ?, 'jp-rarity-v1.5', '2026-09-04')\n        ON CONFLICT(canonical_key) DO UPDATE SET\n          name_ja = excluded.name_ja,\n          japan_availability_score = excluded.japan_availability_score,\n          japan_rarity_score = excluded.japan_rarity_score,\n          japan_rarity_label = excluded.japan_rarity_label,\n          japan_rarity_confidence = excluded.japan_rarity_confidence,\n          rarity_reason = excluded.rarity_reason,\n          evidence_version = excluded.evidence_version,\n          evaluated_at = excluded.evaluated_at,\n          updated_at = datetime('now')\`).bind(\n          normalizeDrinkMasterKey(name), name, availability, rarity, label, confidence, reason,\n        ));\n        if (typeof env.DRINK_DB.batch === 'function') await env.DRINK_DB.batch(statements);\n        else for (const statement of statements) await statement.run();\n`;
          s=s.slice(0,start)+upsert+s.slice(end);
          fs.writeFileSync(p,s);

          const t='test/drink-master.test.mjs';
          let test=fs.readFileSync(t,'utf8');
          test=test.replace(/jp-rarity-v1\\\.3/, 'jp-rarity-v1\\.5');
          if(!test.includes('ON CONFLICT')) {
            test=test.replace("  assert.match(source, /ピスコサワー/);", "  assert.match(source, /ピスコサワー/);\n  assert.match(source, /ON CONFLICT\\(canonical_key\\) DO UPDATE SET/);\n  assert.match(source, /パローマ\\\",64,36/);");
          }
          fs.writeFileSync(t,test);
          NODE
      - name: Validate
        run: |
          node --check src/worker.mjs
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.mjs test/drink-master.test.mjs
          git commit -m "Apply Japan rarity calibration v1.5"
          git push origin main
