name: B26 count temp
on:
  push:
    branches: ['automation/drink-master-b26']
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --input-type=module -e "import {DRINK_MASTER_EXPANSION_B26 as a,DRINK_MASTER_EXPANSION_B26_EXCLUDED as e} from './src/drink-master-expansion-b26-approved.mjs'; await import('node:fs').then(fs=>fs.writeFileSync('b26-result.json',JSON.stringify({approved:a.length,excluded:e},null,2)))"
      - uses: actions/upload-artifact@v4
        with:
          name: b26-count
          path: b26-result.json