name: One-off wire drink master batch 07
on:
  push:
    branches: [auto/drink-master-b07]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/drink-master-b07
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire batch 07 runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/worker-v1.9.mjs')
          s=p.read_text()
          imp="import { DRINK_MASTER_EXPANSION_B07, DRINK_MASTER_EXPANSION_B07_SEED_ROWS, DRINK_MASTER_EXPANSION_B07_ALIAS_ENTRIES, DRINK_MASTER_EXPANSION_B07_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B07_EVALUATED_AT } from './drink-master-expansion-b07.mjs';\n"
          marker="import { DRINK_MASTER_EXPANSION_B06, DRINK_MASTER_EXPANSION_B06_SEED_ROWS, DRINK_MASTER_EXPANSION_B06_ALIAS_ENTRIES, DRINK_MASTER_EXPANSION_B06_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B06_EVALUATED_AT } from './drink-master-expansion-b06.mjs';\n"
          if imp not in s:
            if marker not in s: raise SystemExit('B06 import marker missing')
            s=s.replace(marker,marker+imp,1)
          s=s.replace('...DRINK_MASTER_EXPANSION_B06_SEED_ROWS].map(', '...DRINK_MASTER_EXPANSION_B06_SEED_ROWS, ...DRINK_MASTER_EXPANSION_B07_SEED_ROWS].map(',1)
          alias="for (const [alias, masterKey] of DRINK_MASTER_EXPANSION_B07_ALIAS_ENTRIES) {\n  LOOKUP_ALIASES.set(normalizeDrinkV19Key(alias), normalizeDrinkV19Key(masterKey));\n}\n"
          alias_marker="for (const [alias, masterKey] of DRINK_MASTER_EXPANSION_B06_ALIAS_ENTRIES) {\n  LOOKUP_ALIASES.set(normalizeDrinkV19Key(alias), normalizeDrinkV19Key(masterKey));\n}\n"
          if alias not in s:
            if alias_marker not in s: raise SystemExit('B06 alias marker missing')
            s=s.replace(alias_marker,alias_marker+alias,1)
          s=s.replace('DRINK_MASTER_EXPANSION_B06_EVIDENCE_VERSION]);','DRINK_MASTER_EXPANSION_B06_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B07_EVIDENCE_VERSION]);',1)
          start=s.index('async function hasExpansionB06Seed(env)')
          end=s.index('\nasync function seedV19IfNeeded(env)',start)
          block=s[start:end]
          block7=block.replace('B06','B07').replace('b06','b07')
          if 'async function hasExpansionB07Seed(env)' not in s:
            s=s[:end]+block7+s[end:]
          s=s.replace('  if (!(await hasExpansionB06Seed(env))) await seedExpansionB06(env);\n','  if (!(await hasExpansionB06Seed(env))) await seedExpansionB06(env);\n  if (!(await hasExpansionB07Seed(env))) await seedExpansionB07(env);\n',1)
          s=s.replace('hasExpansionB05Seed, hasExpansionB06Seed };','hasExpansionB05Seed, hasExpansionB06Seed, hasExpansionB07Seed };',1)
          p.write_text(s)
          PY
      - run: npm test
      - run: npm run validate:drink-master-v1.9
      - name: Commit wiring and remove one-off workflow
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-wire-b07.yml
          git add -A
          git commit -m 'Wire drink master expansion batch 07' || true
          git push origin HEAD:auto/drink-master-b07 || true
