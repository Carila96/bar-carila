name: One-off progressive recommendation patch
on:
  push:
    branches:
      - perf/progressive-sonnet-selection
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/progressive-sonnet-selection
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/patch-progressive-selection.py
      - run: npm test
      - run: npm run validate:drink-master-v1.9
      - name: Commit clean patch and remove one-off files
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-progressive-selection.yml scripts/patch-progressive-selection.py
          git add -A
          git commit -m 'Add progressive open-world recommendation selection' || true
          git push origin HEAD:perf/progressive-sonnet-selection || true
