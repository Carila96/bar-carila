いBAR向きです。\"], [\"ネバダ\", \"ラムにグレープフルーツ、ライム、ビターズなどを合わせるクラシック。\", \"柑橘の酸味とほろ苦さでドライ寄り。\", \"クラシックカクテルに強いBARで名前を伝えて相談するのが確実です。\"], [\"スカイダイビング\", \"ラムにブルーキュラソーとライムを合わせる鮮やかなショートカクテル。\", \"甘酸っぱく爽快で、ラムの香りが残る。\", \"ブルーキュラソーを置くカクテルBARなら比較的頼みやすいです。\"], [\"テキーラトニック\", \"テキーラをトニックウォーターで割る、シンプルなロングカクテル。\", \"青い香りとほろ苦い炭酸感。\", \"材料がシンプルなので、テキーラを置くBARなら頼みやすいです。\"], [\"テキーラリッキー\", \"テキーラにライムとソーダを合わせるドライなロングカクテル。\", \"甘さ控えめで青い香りと柑橘が中心。\", \"さっぱりしたテキーラ系を頼みたい時に向きます。\"], [\"アイスブレーカー\", \"テキーラにグレープフルーツやリキュールを合わせるフルーティーなカクテル。\", \"甘酸っぱさとテキーラの青い香り。\", \"テキーラカクテルを複数扱うBARで頼むと通りやすいです。\"], [\"アンバサダー\", \"テキーラにオレンジ系の要素を合わせる、軽快でフルーティーなロングカクテル。\", \"柑橘の甘酸っぱさとテキーラの香り。\", \"専門BARやカクテル数の多い店で名前を伝えるのが確実です。\"], [\"スローテキーラ\", \"テキーラを軸にスロージンなどを合わせる、果実感のあるカクテル。\", \"ベリー系の甘酸っぱさとテキーラの芯。\", \"スロージン常備の有無で店差があるため、注文前に確認がおすすめです。\"], [\"ニューヨーク\", \"ウイスキーにライムとグレナデンを合わせる赤みのあるクラシック。\", \"ウイスキーの厚みに甘酸っぱい柑橘。\", \"クラシックBARでは比較的頼みやすいウイスキーカクテルです。\"], [\"オールドパル\", \"ウイスキー、ドライベルモット、カンパリを合わせるビターなクラシック。\", \"ドライでほろ苦く、香草感がある。\", \"ネグローニ系の苦みが好きなら伝わりやすい一杯です。\"], [\"ジョンコリンズ\", \"ウイスキーにレモン、甘味、ソーダを合わせる爽快なロングカクテル。\", \"甘酸っぱく軽快で、ウイスキーのコクも残る。\", \"材料が一般的なのでクラシックBARでは頼みやすいです。\"], [\"マミーテイラー\", \"スコッチにライムとジンジャーエールを合わせるロングカクテル。\", \"スモーキーさと生姜の刺激、柑橘の爽快感。\", \"スコッチを軽快に飲みたい時に向くクラシックです。\"], [\"ハイランドクーラー\", \"スコッチを柑橘やジンジャー系で軽快に仕上げるロングカクテル。\", \"ウイスキーの香りに爽やかな酸味と炭酸。\", \"ウイスキーカクテルに強いBARで相談すると通りやすいです。\"], [\"ワードエイト\", \"ウイスキーにレモン、オレンジ、グレナデンを合わせるボストン生まれのクラシック。\", \"甘酸っぱく果実感があり、ウイスキーの厚みもある。\", \"クラシックに強いBARで名前を指定する注文向きです。\"], [\"ブラッドアンドサンド\", \"スコッチにベルモット、チェリー系リキュール、オレンジを合わせるクラシック。\", \"甘く芳醇で、果実感とスコッチが重なる。\", \"材料が複数あるため、オーセンティックBARで頼むのが確実です。\"], [\"ボビーバーンズ\", \"スコッチにスイートベルモットとベネディクティンを重ねる重厚なクラシック。\", \"芳醇でハーバル。ウイスキーの余韻が長い。\", \"ベネディクティンの在庫があるクラシックBAR向きです。\"], [\"スコッチキルト\", \"スコッチを軸に香味を整える、古典的なショートカクテル。\", \"ウイスキー主体でドライかつ芳醇。\", \"名前が通じる専門BARで相談しながら頼むのが確実です。\"], [\"ブランデーサワー\", \"ブランデーに柑橘と甘味を合わせる、基本形のサワースタイル。\", \"芳醇なブランデーと甘酸っぱい柑橘。\", \"クラシックカクテルを扱うBARなら比較的頼みやすいです。\"], [\"オリンピック\", \"ブランデーにオレンジリキュールとオレンジを合わせるフルーティーなクラシック。\", \"柑橘の甘みとブランデーの厚み。\", \"材料が比較的一般的で、クラシックBARでは通りやすいです。\"], [\"ハーバード\", \"ブランデーとベルモットを軸にまとめるクラシックカクテル。\", \"芳醇でやや甘く、香草の余韻。\", \"専門的なクラシックなので、オーセンティックBAR向きです。\"], [\"ブランデースマッシュ\", \"ブランデーにミントと甘味を合わせる古典的なスマッシュ。\", \"芳醇な甘みとミントの清涼感。\", \"現行メニューでは少なめなので、クラシックに強いBARで相談してください。\"], [\"ブランデーエッグノッグ\", \"ブランデーに卵やミルクを合わせる濃厚なクラシック。\", \"まろやかで甘く、卵と乳のコクが強い。\", \"卵を扱えるかを確認してから頼むのが確実です。\"], [\"ゴールデンキャデラック\", \"ガリアーノ、カカオ系リキュール、クリームを合わせるデザートカクテル。\", \"甘く濃厚でバニラとカカオの香り。\", \"ガリアーノがあるBARなら食後の一杯として頼みやすいです。\"], [\"ゴールデンドリーム\", \"ガリアーノにオレンジ系リキュールとクリームを合わせる甘口カクテル。\", \"バニラと柑橘、クリームの濃厚な甘み。\", \"ガリアーノの在庫があるか確認すると確実です。\"], [\"バレンシア\", \"アプリコットブランデーとオレンジを合わせるフルーティーなカクテル。\", \"杏とオレンジのやわらかな甘酸っぱさ。\", \"アプリコット系リキュールを置くBARなら比較的頼みやすいです。\"], [\"アプリコットクーラー\", \"アプリコット系リキュールを柑橘や炭酸で軽快に仕上げるロングカクテル。\", \"甘い杏の香りと爽やかな酸味。\", \"リキュールの在庫を確認すると注文が通りやすいです。\"], [\"アマレットサワー\", \"アマレットにレモンなどを合わせ、甘さと酸味を整えるサワースタイル。\", \"杏仁の甘い香りと鮮やかな酸味。\", \"アマレットを置くBARでは比較的相談しやすい一杯です。\"], [\"アマレットジンジャー\", \"アマレットをジンジャーエールで割る、シンプルで香り高いロングカクテル。\", \"杏仁の甘い香りと生姜の爽快感。\", \"材料が少なく、一般的なBARでも頼みやすいです。\"], [\"アドニス\", \"シェリーとスイートベルモットを合わせる低アルコール寄りのクラシック。\", \"ドライで香ばしく、ハーバルな余韻。\", \"シェリーを置くオーセンティックBARで頼みやすいです。\"], [\"カーディナル\", \"赤ワインにカシスを合わせる、キールの赤ワイン版にあたるカクテル。\", \"赤果実の甘みとワインの渋み。\", \"材料がシンプルなのでワインを扱うBARなら比較的頼みやすいです。\"], [\"アメリカンレモネード\", \"レモネードに赤ワインを重ねる、甘酸っぱく見た目も特徴的なカクテル。\", \"爽やかな酸味と赤ワインの果実味。\", \"一般BARやダイニングBARでも比較的通りやすいです。\"], [\"ドッグズノーズ\", \"ビールにジンを加える、シンプルで力強いビアカクテル。\", \"ビールの苦みにジンの香りとアルコール感。\", \"材料が少ないため、名前が通じれば作りやすい一杯です。\"], [\"ビアスプリッツァー\", \"ビールと白ワインを合わせる軽快なビアカクテル。\", \"爽やかな炭酸感と白ワインの酸味。\", \"ビールと白ワインを扱う店なら比較的頼みやすいです。\"]]")
          aliases = json.loads("[[\"ブルドック\", \"ブルドッグ\"], [\"アイスブレイカー\", \"アイスブレーカー\"], [\"マミーテーラー\", \"マミーテイラー\"], [\"ドッグスノーズ\", \"ドッグズノーズ\"], [\"ウォッカ・トニック\", \"ウォッカトニック\"], [\"ウォッカ・リッキー\", \"ウォッカリッキー\"], [\"ラム・トニック\", \"ラムトニック\"], [\"ラム・バック\", \"ラムバック\"], [\"テキーラ・トニック\", \"テキーラトニック\"], [\"テキーラ・リッキー\", \"テキーラリッキー\"]]")

          p=Path('src/worker.mjs')
          s=p.read_text()

          def append_rows(source, const_name, rows):
              marker=f"const {const_name} = ["
              start=source.index(marker)
              end=source.index('];', start)
              prefix=source[:end]
              suffix=source[end:]
              entries=','.join(json.dumps(row, ensure_ascii=False, separators=(',',':')) for row in rows)
              if entries and not prefix.rstrip().endswith('['):
                  prefix=prefix.rstrip()+','
              return prefix+entries+suffix

          s=append_rows(s,'DRINK_MASTER_SEED',master)
          s=append_rows(s,'DRINK_COPY_SEED',copy)
          s=append_rows(s,'DRINK_MASTER_ALIASES',aliases)
          s=s.replace("jp-rarity-v1.7","jp-rarity-v1.8")
          p.write_text(s)

          p=Path('test/drink-copy-coverage.test.mjs')
          t=p.read_text().replace("all 100 calibrated drinks have fixed D1 copy","all 150 calibrated drinks have fixed D1 copy").replace("master.length,100","master.length,150")
          p.write_text(t)

          p=Path('test/drink-master.test.mjs')
          t=p.read_text().replace("jp-rarity-v1\\.7","jp-rarity-v1\\.8")
          needle="  assert.match(source, /雪国/);"
          replacement=needle+"\n  assert.match(source, /アラスカ/);\n  assert.match(source, /ブラッディシーザー/);\n  assert.match(source, /ゴールデンキャデラック/);\n  assert.match(source, /ビアスプリッツァー/);"
          if needle not in t:
              raise SystemExit('drink-master test insertion point missing')
          t=t.replace(needle,replacement,1)
          p.write_text(t)
          PY
      - name: Validate
        run: |
          node --check src/worker.mjs
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker.mjs test/drink-copy-coverage.test.mjs test/drink-master.test.mjs
          git commit -m "Expand Japan rarity drink master to 150"
          git push
