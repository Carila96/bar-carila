name: One-off fix Aperol Spritz image
on:
  push:
    branches:
      - fix/aperol-spritz-image
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aperol-spritz-image
      - name: Patch verified Aperol Spritz image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/assets/js/main.js')
          s=p.read_text(encoding='utf-8')
          old='"アペロールスプリッツ": "https://images.unsplash.com/photo-1563077764-93e534f3acaa?w=800&auto=format&fit=crop"'
          new='"アペロールスプリッツ": "https://images.unsplash.com/photo-1688912740928-123e137c45fd?w=800&auto=format&fit=crop"'
          if old not in s: raise SystemExit('Aperol Spritz static image anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          t=Path('test/worker.test.mjs')
          s=t.read_text(encoding='utf-8')
          marker="test('drink image client refreshes exact-name images before trusting old generic placeholders', async () => {"
          extra="test('Aperol Spritz has a verified orange drink placeholder', async () => {\n  const js = await readFile(new URL('../public/assets/js/main.js', import.meta.url), 'utf8');\n  assert.match(js, /\\\"アペロールスプリッツ\\\": \\\"https:\\/\\/images\\.unsplash\\.com\\/photo-1688912740928-123e137c45fd/);\n  assert.doesNotMatch(js, /\\\"アペロールスプリッツ\\\": \\\"https:\\/\\/images\\.unsplash\\.com\\/photo-1563077764-93e534f3acaa/);\n});\n\n"
          if 'verified orange drink placeholder' not in s:
              if marker not in s: raise SystemExit('image test marker missing')
              s=s.replace(marker,extra+marker,1)
          t.write_text(s,encoding='utf-8')
          PY
      - name: Run tests
        run: |
          npm ci
          npm test
          npm run validate:drink-master-v1.9
      - name: Commit patch and remove one-off workflow
        run: |
          rm -f .github/workflows/oneoff-fix-aperol-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Aperol Spritz image"
          git push origin HEAD:fix/aperol-spritz-image
