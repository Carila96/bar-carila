name: One-shot D1 verification
on:
  push:
    branches:
      - chatgpt/d1-verification
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[generated-d1-verification]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch-d1-verification.py
      - run: npm test
      - run: node --check src/worker.mjs
      - name: Commit verification support
        run: |
          rm -f .github/workflows/one-shot-d1-verification.yml scripts/patch-d1-verification.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expose drink image source for D1 verification [generated-d1-verification]"
          git push
