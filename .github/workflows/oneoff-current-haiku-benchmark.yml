name: One-off current Haiku production benchmark

on:
  push:
    branches: [bench/current-haiku-production]

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench/current-haiku-production
      - name: Benchmark Haiku on current production
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<'JSON'
          {"model":"claude-haiku-4-5-20251001","max_tokens":850,"system":"あなたはBar Carilaのバーテンダーです。以下の回答から今夜の一杯を1つだけ選んでください。質問は返さず、必ずtype=recommendationのJSONだけを返してください。drinkにはname, masterKey, category, description, trivia, recipe, imageQueryを含めてください。","messages":[{"role":"user","content":"route=cocktail。甘さ控えめ、さっぱり、柑橘、炭酸あり、度数は中程度、仕事終わりに飲みたい。"}]}
          JSON
          for i in 1 2 3; do
            rm -f /tmp/h /tmp/b
            metrics=$(curl -sS -D /tmp/h -o /tmp/b --max-time 80 -H 'content-type: application/json' --data-binary @/tmp/payload.json -w 'status=%{http_code} total_s=%{time_total} ttfb_s=%{time_starttransfer}' https://bar.carilaworks.com/api/chat)
            st=$(grep -i '^server-timing:' /tmp/h | tr -d '\r' || true)
            name=$(jq -r '.content[0].text // empty' /tmp/b 2>/dev/null | sed -n 's/.*"name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
            echo "run=$i $metrics ${st:-server-timing=missing} drink=${name:-unknown}"
          done
      - name: Self-delete workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-current-haiku-benchmark.yml
          git add -A
          git commit -m 'Remove one-off current Haiku benchmark' || true
          git push origin HEAD:bench/current-haiku-production || true
