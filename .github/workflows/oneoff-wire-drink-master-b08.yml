name: One-off wire drink master B08
on:
  push:
    branches: [data/drink-master-expansion-b08]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, 'Wire drink master batch 08 runtime') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/drink-master-expansion-b08
      - name: Wire batch 08 into runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/worker-v1.9.mjs')
          s=p.read_text()
          imp="import { DRINK_MASTER_EXPANSION_B08, DRINK_MASTER_EXPANSION_B08_SEED_ROWS, DRINK_MASTER_EXPANSION_B08_ALIAS_ENTRIES, DRINK_MASTER_EXPANSION_B08_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B08_EVALUATED_AT } from './drink-master-expansion-b08.mjs';\n"
          anchor="import { DRINK_MASTER_EXPANSION_B07, DRINK_MASTER_EXPANSION_B07_SEED_ROWS, DRINK_MASTER_EXPANSION_B07_ALIAS_ENTRIES, DRINK_MASTER_EXPANSION_B07_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B07_EVALUATED_AT } from './drink-master-expansion-b07.mjs';\n"
          if 'DRINK_MASTER_EXPANSION_B08' not in s:
              s=s.replace(anchor,anchor+imp)
              s=s.replace('...DRINK_MASTER_EXPANSION_B07_SEED_ROWS].map(', '...DRINK_MASTER_EXPANSION_B07_SEED_ROWS, ...DRINK_MASTER_EXPANSION_B08_SEED_ROWS].map(')
              alias="for (const [alias, masterKey] of DRINK_MASTER_EXPANSION_B08_ALIAS_ENTRIES) {\n  LOOKUP_ALIASES.set(normalizeDrinkV19Key(alias), normalizeDrinkV19Key(masterKey));\n}\n"
              mark="for (const [alias, masterKey] of DRINK_MASTER_EXPANSION_B07_ALIAS_ENTRIES) {\n  LOOKUP_ALIASES.set(normalizeDrinkV19Key(alias), normalizeDrinkV19Key(masterKey));\n}\n"
              s=s.replace(mark,mark+alias)
              s=s.replace('DRINK_MASTER_EXPANSION_B07_EVIDENCE_VERSION]);','DRINK_MASTER_EXPANSION_B07_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B08_EVIDENCE_VERSION]);')
              start=s.index('async function hasExpansionB07Seed(env)')
              end=s.index('async function seedV19IfNeeded(env)', start)
              block=s[start:end].replace('B07','B08')
              s=s[:end]+block+s[end:]
              s=s.replace('if (!(await hasExpansionB07Seed(env))) await seedExpansionB07(env);','if (!(await hasExpansionB07Seed(env))) await seedExpansionB07(env);\n  if (!(await hasExpansionB08Seed(env))) await seedExpansionB08(env);')
              s=s.replace('hasExpansionB06Seed, hasExpansionB07Seed };','hasExpansionB06Seed, hasExpansionB07Seed, hasExpansionB08Seed };')
          p.write_text(s)
          PY
      - name: Run validation
        run: |
          npm ci
          npm test
          npm run validate:drink-master-v1.9
      - name: Commit wiring and remove one-off workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-wire-drink-master-b08.yml
          git add -A
          git commit -m 'Wire drink master batch 08 runtime'
          git push origin HEAD:data/drink-master-expansion-b08
