name: Fix drink master batch 03 evidence
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/data/drink-master-expansion-b03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/drink-master-expansion-b03
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/fix-b03-evidence.py
      - run: npm test
      - run: npm run validate:drink-master-v1.9
      - name: Commit clean evidence correction
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-fix-b03-evidence.yml scripts/fix-b03-evidence.py
          git add -A
          git commit -m 'Strengthen drink master batch 03 evidence' || true
          git push origin HEAD:data/drink-master-expansion-b03 || true
