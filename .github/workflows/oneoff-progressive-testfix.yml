name: One-off progressive test expectation fix
on:
  push:
    branches:
      - perf/progressive-sonnet-selection
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/progressive-sonnet-selection
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update stale expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('test/drink-copy.test.mjs')
          s=p.read_text()
          s=s.replace(r"/const maxTokens=fastTurn\?600:850/", r"/const maxTokens=forceRecommend\?320:\(fastTurn\?600:850\)/")
          p.write_text(s)

          p=Path('test/worker.test.mjs')
          s=p.read_text()
          s=s.replace(r"/const maxTokens=fastTurn\?600:850/", r"/const maxTokens=forceRecommend\?320:\(fastTurn\?600:850\)/")
          s=s.replace(r"/const system=forceRecommend\?getFinalSystem\(\)/", r"/const system=forceRecommend\?getSelectionSystem\(\)/")
          p.write_text(s)
          PY
      - run: npm test
      - run: npm run validate:drink-master-v1.9
      - name: Commit clean test update
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-progressive-testfix.yml
          git add -A
          git commit -m 'Update progressive recommendation regression expectations' || true
          git push origin HEAD:perf/progressive-sonnet-selection || true
