name: One-shot final load optimization

on:
  push:
    branches:
      - chatgpt/final-load-optimization

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[generated-final-load]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: python -m pip install pillow
      - name: Optimize assets and initial render
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          public = Path('public')
          pandas = public / 'pandas'

          bg = public / 'assets/images/bar-background.webp'
          with Image.open(bg) as im:
              im.save(bg, 'WEBP', quality=78, method=6)

          for png in pandas.glob('*.png'):
              with Image.open(png) as im:
                  im.save(png.with_suffix('.webp'), 'WEBP', quality=84, method=6)

          html_path = public / 'index.html'
          html = html_path.read_text()
          html = re.sub(r'<script async src="https://www\.googletagmanager\.com/gtag/js\?id=G-124MM8RN7Z"></script>\s*<script>window\.dataLayer=.*?</script>', '', html, count=1, flags=re.S)

          font_href = 'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Noto+Serif+JP:wght@200;300;400&display=swap'
          html = html.replace(f'<link rel="stylesheet" href="{font_href}">', f'<link rel="preload" as="style" href="{font_href}" onload="this.onload=null;this.rel=\'stylesheet\'">\n<noscript><link rel="stylesheet" href="{font_href}"></noscript>')

          replacements = {
              '/pandas/p-counter.png': '/pandas/p-counter.webp', '/pandas/p-loading.png': '/pandas/p-loading.webp',
              '/pandas/p-think.png': '/pandas/p-think.webp', '/pandas/p-approve.png': '/pandas/p-approve.webp',
              '/pandas/p-sad.png': '/pandas/p-sad.webp', '/pandas/p-curious.png': '/pandas/p-curious.webp',
              '/pandas/p-relax.png': '/pandas/p-relax.webp', '/pandas/p-bartender.png': '/pandas/p-bartender.webp',
              '/pandas/logo.png': '/pandas/logo.webp',
          }
          for old, new in replacements.items(): html = html.replace(old, new)

          html = re.sub(r'(<img class="panda-img active"\s+id="p-counter"\s+)src="([^"]+)"', r'\1src="\2" fetchpriority="high" decoding="async"', html)
          html = re.sub(r'(<img class="panda-img"\s+id="p-(?!counter)[^"]+"\s+)src="([^"]+)"', r'\1data-src="\2" decoding="async"', html)
          html = html.replace('<button class="logo-btn" onclick="goHome()"><img src="/pandas/logo.webp" alt="">', '<button class="logo-btn" onclick="goHome()"><img src="/pandas/logo.webp" alt="" loading="lazy" decoding="async">')

          loader = '''<script>(()=>{const load=(img)=>{if(!img||img.src||!img.dataset.src)return;img.src=img.dataset.src;delete img.dataset.src;};document.querySelectorAll('.panda-img.active').forEach(load);const stage=document.getElementById('pandaStage');if(stage)new MutationObserver((records)=>{for(const r of records){const img=r.target;if(img.classList?.contains('panda-img')&&img.classList.contains('active'))load(img);}}).observe(stage,{subtree:true,attributes:true,attributeFilter:['class']});const startAnalytics=()=>{window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config','G-124MM8RN7Z');const s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id=G-124MM8RN7Z';document.head.appendChild(s);};window.addEventListener('load',()=>{'requestIdleCallback'in window?requestIdleCallback(startAnalytics,{timeout:2000}):setTimeout(startAnalytics,800)},{once:true});})();</script>'''
          html = html.replace('<script src="/assets/js/main.js" defer></script>', '<script src="/assets/js/main.js" defer></script>\n' + loader)
          html_path.write_text(html)

          wrangler = Path('wrangler.jsonc')
          text = wrangler.read_text().replace('      "/",\n      "/index.html",\n', '')
          wrangler.write_text(text)
          PY
      - run: npm test
      - run: node --check public/assets/js/main.js
      - name: Show size changes
        run: du -h public/index.html public/assets/images/bar-background.webp public/pandas/*.webp | sort -h
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-final-load-optimization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish initial-load optimization [generated-final-load]"
          git push
