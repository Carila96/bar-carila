name: One-off current recommendation latency benchmark
on:
  push:
    branches: [bench/current-latency]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bench/current-latency
      - name: Benchmark production recommendation path
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.json <<'JSON'
          {
            "model":"claude-sonnet-5",
            "max_tokens":850,
            "system":"あなたはBar Carilaのバーテンダーです。以下の回答から今夜の一杯を1つだけ選んでください。質問は返さず、必ずtype=recommendationのJSONだけを返してください。drinkにはname, masterKey, category, description, trivia, recipe, imageQueryを含めてください。",
            "messages":[{"role":"user","content":"route=cocktail。甘さ控えめ、さっぱり、柑橘、炭酸あり、度数は中程度、仕事終わりに飲みたい。"}]
          }
          JSON
          echo '=== health ==='
          curl -sS -o /dev/null -w 'health_total_ms=%{time_total}\n' https://bar.carilaworks.com/health
          echo '=== recommendation runs ==='
          for i in 1 2 3 4 5; do
            rm -f /tmp/h /tmp/b
            metrics=$(curl -sS -D /tmp/h -o /tmp/b \
              -H 'content-type: application/json' \
              --data-binary @/tmp/payload.json \
              -w 'status=%{http_code} total_s=%{time_total} ttfb_s=%{time_starttransfer}' \
              https://bar.carilaworks.com/api/chat)
            st=$(grep -i '^server-timing:' /tmp/h | tr -d '\r' || true)
            echo "run=$i $metrics ${st:-server-timing=missing}"
            python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/b'))
              text=next((x.get('text','') for x in d.get('content',[]) if isinstance(x,dict) and 'text' in x),'')
              try:
                  p=json.loads(text)
                  print('drink=', p.get('drink',{}).get('name'), 'source=', p.get('drink',{}).get('masterSource'))
              except Exception:
                  print('text_prefix=', text[:180].replace('\n',' '))
          except Exception as e:
              print('body_parse_error=',e)
          PY
          done
      - name: Self-delete workflow
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-current-latency.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-off current latency benchmark'
            git push origin HEAD:bench/current-latency
          fi
