name: BarCarila extract performance assets

on:
  push:
    branches:
      - chatgpt/barcarila-full-load-optimization

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[generated-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract split assets
        run: node scripts/extract-performance-assets.mjs
      - name: Run tests
        run: npm test
      - name: Check extracted JavaScript syntax
        run: node --check public/assets/js/main.js
      - name: Commit generated assets
        run: |
          rm .github/workflows/barcarila-extract-assets.yml
          rm scripts/extract-performance-assets.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize BarCarila initial load [generated-assets]"
          git push
