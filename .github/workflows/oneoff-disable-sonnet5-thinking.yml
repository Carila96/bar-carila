name: One-off disable Sonnet 5 thinking

on:
  push:
    branches:
      - perf/sonnet5-no-thinking

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/sonnet5-no-thinking
      - name: Disable adaptive thinking for recommendation requests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/worker-v1.9.mjs')
          s = p.read_text(encoding='utf-8')
          old = "  if (!body || typeof body !== 'object' || typeof body.system !== 'string') return request;\n  body.system +="
          new = "  if (!body || typeof body !== 'object' || typeof body.system !== 'string') return request;\n  if (body.model === 'claude-sonnet-5') body.thinking = { type: 'disabled' };\n  body.system +="
          if old not in s:
              raise SystemExit('Sonnet 5 request patch point not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/oneoff-disable-sonnet5-thinking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker-v1.9.mjs .github/workflows/oneoff-disable-sonnet5-thinking.yml
          git commit -m "Disable Sonnet 5 adaptive thinking for drink recommendations"
          git push origin HEAD:perf/sonnet5-no-thinking
