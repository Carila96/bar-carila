name: One-off BarCarila UX speed and image v2
on:
  push:
    branches:
      - ux/pacing-latency-image-v2
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/pacing-latency-image-v2
      - name: Patch pacing final prompt and drink images
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/assets/js/main.js')
          s=p.read_text(encoding='utf-8')
          anchor="const DRINK_META_CACHE_KEY='bar_carila_drink_meta_cache_v1';"
          if anchor not in s: raise SystemExit('top constant anchor missing')
          s=s.replace(anchor,anchor+"\nconst LOCAL_CHOICE_DELAY_MS=450;\nconst sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));",1)
          old="const DRINK_IMG_CACHE_KEY='bar_carila_drink_img_cache_v1';"
          if old not in s: raise SystemExit('drink image cache key anchor missing')
          s=s.replace(old,"const DRINK_IMG_CACHE_KEY='bar_carila_drink_img_cache_v2';",1)
          anchor="function initialAssistantPayload(){return {type:'question',emotion:'counter',message:t().initialMsg,choices:t().initialChoices};}"
          if anchor not in s: raise SystemExit('initialAssistantPayload anchor missing')
          final_lines=[
              "function getFinalSystem(){return `あなたはBar Carilaのバーテンダーです。messages内のこれまでの質問と回答をすべて読み、今夜の一杯を1つだけ選んでください。",
              "",
              "【最終推薦ターン固定】",
              "・ここでは質問を返さず、必ず type=recommendation を返す。",
              "・ユーザーの回答を総合し、味・香り・強さ・気分・場面に合う実在する一杯を選ぶ。",
              "・日本のBARで実際に注文する場面を前提にする。カクテル／モクテルは標準的なレシピを使う。単体酒は自然な銘柄またはカテゴリを提案する。",
              "・説明は簡潔にし、同じ内容を繰り返さない。",
              "・JSON文字列の値に生の改行を含めない。analysisを含む全ての文字列は1行。Markdownコードフェンス、前置き、後書きは禁止。",
              "",
              "【出力JSON】",
              '{"type":"recommendation","emotion":"bartender or relax or counter or curious","message":"短い一言","analysis":"今夜の気分を2〜3文で表す1行の文章","drink":{"name":"正式名称","masterKey":"標準的な英語名","category":"カテゴリ","abv":"約8%のような推定値","rarity":0,"description":"60字以内の説明1文","trivia":"80字以内の豆知識またはBARでの楽しみ方","recipe":{"ingredients":[{"name":"材料","amount":"分量"}],"method":"作り方1文"},"tags":["タグ1","タグ2","タグ3"]}}',
              "・カクテル／モクテルはrecipe必須。単体酒のみrecipe:null可。",
              "・rarityは0〜100の整数で日本の一般BARで見つけにくいほど高くする。固定マスター対象はサーバー側で上書きされる。",
              "・emotionはカクテル／モクテル=bartender、洋酒=relax、珍しい提案=curiousを基本にする。`+(I18N[lang].langRule||'');}",
              "",
          ]
          final_system='\n'.join(final_lines)
          s=s.replace(anchor,final_system+anchor,1)
          old="const maxTokens=fastTurn?600:2200;"
          if old not in s: raise SystemExit('maxTokens anchor missing')
          s=s.replace(old,"const maxTokens=fastTurn?600:1200;",1)
          old="const system=fastTurn?getFastSystem():getSystem()+(forceRecommend?'\\n\\n【最終推薦ターン固定】ここでは質問を返さず、必ず type=recommendation のJSONを返してください。JSON文字列の値に生の改行を含めないでください。analysisを含む全ての文字列は1行で出力してください。Markdownコードフェンスや前置き・後書きは禁止です。':'');"
          if old not in s: raise SystemExit('system selection anchor missing')
          s=s.replace(old,"const system=forceRecommend?getFinalSystem():(fastTurn?getFastSystem():getSystem());",1)
          old="    presentLocalQuestion(first);\n    return true;"
          if old not in s: raise SystemExit('first local question anchor missing')
          s=s.replace(old,"    await sleep(LOCAL_CHOICE_DELAY_MS);\n    presentLocalQuestion(first);\n    return true;",1)
          old="  if(localFlow.step<questions.length){\n    presentLocalQuestion(questions[localFlow.step]);\n    return true;\n  }"
          if old not in s: raise SystemExit('next local question anchor missing')
          s=s.replace(old,"  if(localFlow.step<questions.length){\n    await sleep(LOCAL_CHOICE_DELAY_MS);\n    presentLocalQuestion(questions[localFlow.step]);\n    return true;\n  }",1)
          old="function getDrinkImg(name,cat){\n  const fixed=findStaticDrinkImg(name);\n  if(fixed)return fixed;\n  const cached=getCachedDrinkImg(name);\n  if(cached)return cached.url;\n  if(cat&&CAT_IMGS[cat])return CAT_IMGS[cat];\n  return pickRandom(FALLBACK_IMGS);\n}"
          new="function getDrinkImg(name,cat){\n  const cached=getCachedDrinkImg(name);\n  if(cached)return cached.url;\n  const fixed=findStaticDrinkImg(name);\n  if(fixed)return fixed;\n  if(cat&&CAT_IMGS[cat])return CAT_IMGS[cat];\n  return pickRandom(FALLBACK_IMGS);\n}"
          if old not in s: raise SystemExit('getDrinkImg anchor missing')
          s=s.replace(old,new,1)
          old="async function fetchDrinkImg(name,cat,imgEl){\n  if(findStaticDrinkImg(name))return;\n  const cached=getCachedDrinkImg(name);"
          new="async function fetchDrinkImg(name,cat,imgEl,searchName=''){\n  const cached=getCachedDrinkImg(name);"
          if old not in s: raise SystemExit('fetchDrinkImg anchor missing')
          s=s.replace(old,new,1)
          old="    const q=buildImgQuery(cat);"
          if old not in s: raise SystemExit('image query anchor missing')
          s=s.replace(old,"    const q=`${searchName||name} ${buildImgQuery(cat)}`.trim();",1)
          old="if(recImgEl)fetchDrinkImg(data.drink.name,data.drink.category,recImgEl);"
          if old not in s: raise SystemExit('recommendation image call anchor missing')
          s=s.replace(old,"if(recImgEl)fetchDrinkImg(data.drink.name,data.drink.category,recImgEl,data.drink.masterKey||'');",1)
          p.write_text(s,encoding='utf-8')
          w=Path('src/worker.mjs')
          s=w.read_text(encoding='utf-8')
          old="const cacheIdentity = normalize(name) || normalize(query);"
          if old not in s: raise SystemExit('worker image cache identity anchor missing')
          s=s.replace(old,"const cacheIdentity = 'v2:' + (normalize(name) || normalize(query));",1)
          old="const searchQuery = query || `${name} cocktail drink`;"
          if old not in s: raise SystemExit('worker image search query anchor missing')
          s=s.replace(old,"const searchQuery = [name, query].filter(Boolean).join(' ').trim() || 'cocktail drink';",1)
          w.write_text(s,encoding='utf-8')
          w=Path('src/worker-v1.9.mjs')
          s=w.read_text(encoding='utf-8')
          old="body.max_tokens = Math.max(Number(body.max_tokens) || 0, 2200);"
          if old not in s: raise SystemExit('worker-v1.9 max token anchor missing')
          s=s.replace(old,"body.max_tokens = Math.max(Number(body.max_tokens) || 0, 1200);",1)
          w.write_text(s,encoding='utf-8')
          t=Path('test/worker.test.mjs')
          s=t.read_text(encoding='utf-8')
          s=s.replace("const maxTokens=fastTurn\\?600:2200","const maxTokens=fastTurn\\?600:1200")
          s=s.replace("Math\\.max\\(Number\\(body\\.max_tokens\\) \\|\\| 0, 2200\\)","Math\\.max\\(Number\\(body\\.max_tokens\\) \\|\\| 0, 1200\\)")
          old="test('drink image client prefers fixed and locally cached images before API search', async () => {\n  const js = await readFile(new URL('../public/assets/js/main.js', import.meta.url), 'utf8');\n  assert.match(js, /const DRINK_IMG_CACHE_KEY='bar_carila_drink_img_cache_v1'/);\n  assert.match(js, /if\\(findStaticDrinkImg\\(name\\)\\)return;/);\n  assert.match(js, /const cached=getCachedDrinkImg\\(name\\);/);\n  assert.match(js, /saveDrinkImgCache\\(name,d\\)/);\n});"
          new="test('drink image client refreshes exact-name images before trusting old generic placeholders', async () => {\n  const js = await readFile(new URL('../public/assets/js/main.js', import.meta.url), 'utf8');\n  assert.match(js, /const DRINK_IMG_CACHE_KEY='bar_carila_drink_img_cache_v2'/);\n  assert.doesNotMatch(js, /if\\(findStaticDrinkImg\\(name\\)\\)return;/);\n  assert.match(js, /searchName\\|\\|name/);\n  assert.match(js, /data\\.drink\\.masterKey\\|\\|''/);\n  assert.match(js, /saveDrinkImgCache\\(name,d\\)/);\n});"
          if old not in s: raise SystemExit('old drink image test anchor missing')
          s=s.replace(old,new,1)
          marker="test('choice-based recommendation flow stays local until the final Sonnet request', async () => {"
          extra="test('guided flow adds a short beat and uses a compact final-only prompt', async () => {\n  const js = await readFile(new URL('../public/assets/js/main.js', import.meta.url), 'utf8');\n  assert.match(js, /const LOCAL_CHOICE_DELAY_MS=450/);\n  assert.equal((js.match(/await sleep\\(LOCAL_CHOICE_DELAY_MS\\)/g)||[]).length, 2);\n  assert.match(js, /function getFinalSystem\\(\\)/);\n  assert.match(js, /const system=forceRecommend\\?getFinalSystem\\(\\)/);\n  assert.match(js, /今夜の一杯を1つだけ選んでください/);\n});\n\ntest('drink image API v2 invalidates generic results and searches with the drink name', async () => {\n  const source = await readFile(new URL('../src/worker.mjs', import.meta.url), 'utf8');\n  assert.match(source, /const cacheIdentity = 'v2:'/);\n  assert.match(source, /\\[name, query\\]\\.filter\\(Boolean\\)\\.join\\(' '\\)/);\n});\n\n"
          if 'guided flow adds a short beat' not in s:
              if marker not in s: raise SystemExit('guided flow test marker missing')
              s=s.replace(marker,extra+marker,1)
          t.write_text(s,encoding='utf-8')
          for f in Path('test').glob('*.mjs'):
              x=f.read_text(encoding='utf-8')
              if '2200' in x:
                  f.write_text(x.replace('2200','1200'),encoding='utf-8')
          PY
      - name: Run tests
        run: |
          npm ci
          npm test
          npm run validate:drink-master-v1.9
      - name: Commit patch and remove one-off workflow
        run: |
          rm -f .github/workflows/oneoff-ux-speed-image-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tune guided pacing, final latency, and drink images"
          git push origin HEAD:ux/pacing-latency-image-v2
