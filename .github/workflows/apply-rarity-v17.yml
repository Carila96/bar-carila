name: Apply Japan rarity v1.7
on:
  push:
    paths:
      - .github/workflows/apply-rarity-v17.yml
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Expand drink master to 100
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          worker = Path('src/worker.mjs')
          s = worker.read_text()

          master = [
            ["雪国",62,38,"やや珍しい",0.86,"日本生まれで国内BARの現行提供例が複数。材料も比較的一般的だが、一般ダイニングBARまで広い定番ではない。"],
            ["バンブー",60,40,"やや珍しい",0.84,"日本と関係の深いクラシックで複数のオーセンティックBARに現行提供例があるが、シェリー常備で店差が出る。"],
            ["ミリオンダラー",45,55,"珍しい",0.78,"日本BAR史上重要なクラシックだが、卵白やパイナップル等を含み一般BARの常設密度は低い。"],
            ["チェリーブロッサム",48,52,"珍しい",0.80,"国内クラシックBARで現行提供例があるが、一般BARでの名称注文と材料常備は中低。"],
            ["サムライロック",65,35,"やや珍しい",0.84,"日本酒とライム中心で作りやすく、日本のBARや飲食店で一定の定着がある。"],
            ["ブルーハワイ",60,40,"やや珍しい",0.86,"一般BAR、ホテル、ダイニングBARで現行提供例が複数。材料は揃いやすいがトロピカル系を扱わない店では差が出る。"],
            ["ゾンビ",38,62,"珍しい",0.80,"国内BARで現行提供例はあるが、複数ラムと副材料を要しレシピも複雑。"],
            ["ダークアンドストーミー",45,55,"珍しい",0.82,"現行提供例があり構成自体は単純だが、ダークラムとジンジャービア常備で店差が大きい。"],
            ["プランターズパンチ",45,55,"珍しい",0.80,"ラム専門・カクテルBARで現行提供例があるが、副材料とレシピ差が大きく一般BAR標準ではない。"],
            ["バカルディカクテル",60,40,"やや珍しい",0.84,"国内メーカーが公式レシピを維持し複数BARでも現行提供。材料は比較的基本的だが名称注文は上位定番より少ない。"],
            ["ボストンクーラー",58,42,"やや珍しい",0.84,"複数の国内BAR・ホテルBARで現行提供され、ラムとジンジャー系を軸に成立しやすい。"],
            ["ソルクバーノ",62,38,"やや珍しい",0.86,"国内の複数BARで現行提供され、ラム・グレープフルーツ・トニックという比較的一般的な材料構成。"],
            ["エルディアブロ",50,50,"珍しい",0.80,"国内BARで現行提供例があり材料も入手可能だが、テキーラ系の中では一般注文密度が低い。"],
            ["マタドール",62,38,"やや珍しい",0.86,"複数の国内BARで現行提供。テキーラ、パイナップル、ライム中心で材料・技法とも比較的容易。"],
            ["ブレイブブル",45,55,"珍しい",0.77,"テキーラとコーヒーリキュールで構成は単純だが、日本の現行一般メニュー密度は低め。"],
            ["ホーセズネック",58,42,"やや珍しい",0.84,"国内クラシックBARで複数現行提供。ブランデーとジンジャーは揃いやすいが、名称注文頻度は中程度。"],
            ["ビトウィーンザシーツ",45,55,"珍しい",0.80,"複数の国内クラシックBARで現行提供されるが、ブランデー・ラム・キュラソーの複合で一般BAR標準ではない。"],
            ["ニコラシカ",55,45,"やや珍しい",0.82,"国内BARで現行提供例が複数あり材料は比較的単純だが、独特の提供・飲み方を含み一般注文頻度は中程度。"],
            ["ジャックローズ",50,50,"珍しい",0.82,"国内の複数クラシックBARで現行提供されるが、アップルブランデーやカルヴァドス常備が制約。"],
            ["シャンパンカクテル",55,45,"やや珍しい",0.82,"ホテル・クラシックBARで成立しやすいが、スパークリング常備と価格帯で一般BARに差が出る。"],
            ["キールインペリアル",50,50,"珍しい",0.80,"国内レストラン・ホテルで提供例があるが、キールやキールロワイヤルほど一般的ではない。"],
            ["ワインクーラー",68,32,"やや珍しい",0.87,"国内の複数BAR・ホテルで現行提供され、ワインと果汁・リキュール中心で成立しやすい。"],
            ["パナシェ",72,28,"比較的よくある",0.88,"国内のビール系メニューで複数確認でき、ビールとレモネード系で材料・技法が容易。"],
            ["ブラックベルベット",45,55,"珍しい",0.80,"国内のビールBAR・カクテルBARで現行提供例はあるが、スタウトとスパークリングの両方を要する。"],
            ["ミチェラーダ",38,62,"珍しい",0.82,"日本でもメキシコ料理店・ホテルBARで提供されるが、ビールにスパイスやトマト等を合わせる専門性があり一般BAR標準ではない。"],
          ]

          copy = [
            ["雪国","ウォッカにホワイトキュラソーとライムを合わせた、日本生まれの端正なショートカクテル。","柑橘の酸味とほのかな甘み。すっきりシャープ。","日本生まれのクラシックを静かに試したい時に向きます。"],
            ["バンブー","ドライシェリーとドライベルモットを合わせ、ビターズで輪郭をつけるクラシック。","ドライでハーバル。シェリー由来の香ばしさ。","シェリーを置くオーセンティックBARで頼みやすい一杯です。"],
            ["ミリオンダラー","ジンを軸にベルモット、パイナップル、卵白などを重ねる日本BAR史のクラシック。","甘酸っぱく芳醇で、卵白の丸い口当たり。","手間のかかるクラシックなので、落ち着いたBARでの注文向きです。"],
            ["チェリーブロッサム","チェリー系リキュールとブランデーを軸に組み立てる、華やかなクラシック。","果実の甘酸っぱさとブランデーの厚み。","クラシックカクテルに強いBARで相談しながら頼むのがおすすめです。"],
            ["サムライロック","日本酒にライムを合わせる、シンプルで爽やかな日本酒カクテル。","日本酒の旨みをライムの酸味が軽く引き締める。","日本酒を少し軽快に飲みたい時に頼みやすい一杯です。"],
            ["ブルーハワイ","ラム、ブルーキュラソー、パイナップル、レモンなどで作る鮮やかなトロピカルカクテル。","甘酸っぱくフルーティーで南国感のある味わい。","トロピカル系を扱うBARやホテルで頼むと成立しやすいです。"],
            ["ゾンビ","複数のラムと柑橘、甘味を重ねる、力強いトロピカルカクテル。","濃厚で複雑。甘酸っぱさの奥に強いラム感。","材料数が多いので、カクテルに強いBARで頼むのが無難です。"],
            ["ダークアンドストーミー","ダークラムとジンジャービアを合わせる、スパイシーで爽快なロングカクテル。","ラムのコクと生姜の刺激。甘さ控えめで爽快。","ジンジャービアがあるかを確認すると注文が通りやすいです。"],
            ["プランターズパンチ","ラムに柑橘や甘味を合わせる、レシピ幅の広いパンチスタイルのカクテル。","ラムの厚みと果実の甘酸っぱさ。","店ごとのレシピ差も楽しめる、カクテルBAR向きの一杯です。"],
            ["バカルディカクテル","ホワイトラム、ライム、グレナデンで作る鮮やかなショートカクテル。","きりっとした酸味にやさしい甘み。","ダイキリ系が好きなら比較しながら頼みやすいクラシックです。"],
            ["ボストンクーラー","ラムをジンジャー系で爽やかに仕上げる、軽快なロングカクテル。","ラムの甘みと生姜の刺激でさっぱり。","重すぎないラムカクテルを飲みたい時に向きます。"],
            ["ソルクバーノ","ラムにグレープフルーツとトニックを合わせる、爽快なロングカクテル。","ほろ苦い柑橘感とラムの甘み。","材料が比較的一般的なので、名前が通じれば頼みやすい一杯です。"],
            ["エルディアブロ","テキーラにカシス、ライム、ジンジャー系を合わせるロングカクテル。","果実の甘酸っぱさと生姜の刺激、テキーラの芯。","マルガリータ以外のテキーラ系を試したい時におすすめです。"],
            ["マタドール","テキーラにパイナップルとライムを合わせるフルーティーなカクテル。","パイナップルの甘みとライムの酸味で飲みやすい。","テキーラの強さを果実でやわらげたい時に頼みやすいです。"],
            ["ブレイブブル","テキーラとコーヒーリキュールを合わせる、シンプルで濃厚なカクテル。","甘く香ばしく、テキーラの力強さが残る。","食後に少量をゆっくり飲みたい時に向きます。"],
            ["ホーセズネック","ブランデーとジンジャーエールを合わせ、長いレモンピールを添えるクラシック。","ブランデーの甘みと生姜の爽快感。","ブランデーを軽快に飲みたい時に注文しやすい一杯です。"],
            ["ビトウィーンザシーツ","ブランデー、ラム、ホワイトキュラソー、レモンを合わせる強めのショートカクテル。","柑橘の酸味の奥に二つのスピリッツの厚み。","アルコール感のあるクラシックを求める時に向きます。"],
            ["ニコラシカ","ブランデーにレモン、砂糖などを組み合わせ、独特の飲み方を楽しむクラシック。","ブランデーの強さを甘味と柑橘が包む。","飲み方を含めてバーテンダーに教わりたい時に面白い一杯です。"],
            ["ジャックローズ","アップルブランデーに柑橘とグレナデンを合わせる赤いショートカクテル。","りんごの芳香と甘酸っぱい果実感。","カルヴァドスやアップルブランデーの在庫があるBAR向きです。"],
            ["シャンパンカクテル","スパークリングワインに砂糖とビターズを合わせる古典的なカクテル。","泡の爽快感にほのかな甘みと苦味。","シャンパンやスパークリングをグラス提供するBARで頼みやすいです。"],
            ["キールインペリアル","スパークリングワインにラズベリー系リキュールを合わせる華やかなカクテル。","ベリーの甘酸っぱさと軽快な泡。","キール系が好きで少し変化をつけたい時に向きます。"],
            ["ワインクーラー","ワインに果汁やリキュールを合わせて軽快に仕上げるロングカクテル。","フルーティーで飲みやすく、ワインの渋みは穏やか。","ワインをそのまま飲むより軽く楽しみたい時に頼みやすいです。"],
            ["パナシェ","ビールとレモネード系飲料を合わせる軽快なビールカクテル。","爽やかな酸味と軽い甘みでビールの苦味は穏やか。","低めのアルコール感でさっぱり飲みたい時に向きます。"],
            ["ブラックベルベット","スタウトとスパークリングワインを合わせる、泡を生かしたビールカクテル。","ロースト感と華やかな泡が同居する独特の味わい。","ギネス系とスパークリングの両方がある店で相談すると確実です。"],
            ["ミチェラーダ","ビールにライム、塩、スパイスやトマト系を合わせるメキシコ発祥のビールカクテル。","酸味、塩味、辛味が重なる食事向きの味わい。","メキシコ系の店や個性的なカクテルに強いBARで頼むのが現実的です。"],
          ]

          aliases = [
            ["Snow Country","雪国"],["Yukiguni","雪国"],["Bamboo","バンブー"],["Million Dollar","ミリオンダラー"],
            ["Cherry Blossom","チェリーブロッサム"],["Samurai Rock","サムライロック"],["Blue Hawaii","ブルーハワイ"],["Zombie","ゾンビ"],
            ["Dark and Stormy","ダークアンドストーミー"],["Dark 'n' Stormy","ダークアンドストーミー"],["Planter's Punch","プランターズパンチ"],
            ["Bacardi Cocktail","バカルディカクテル"],["バカルディ","バカルディカクテル"],["Boston Cooler","ボストンクーラー"],["Sol Cubano","ソルクバーノ"],
            ["El Diablo","エルディアブロ"],["Matador","マタドール"],["Brave Bull","ブレイブブル"],["Horse's Neck","ホーセズネック"],
            ["ホーゼズネック","ホーセズネック"],["Between the Sheets","ビトウィーンザシーツ"],["ビトウィンザシーツ","ビトウィーンザシーツ"],
            ["Nikolaschka","ニコラシカ"],["Jack Rose","ジャックローズ"],["Champagne Cocktail","シャンパンカクテル"],
            ["Kir Imperial","キールインペリアル"],["キール・インペリアル","キールインペリアル"],["Wine Cooler","ワインクーラー"],
            ["Panache","パナシェ"],["Black Velvet","ブラックベルベット"],["Michelada","ミチェラーダ"],
          ]

          def append_rows(text, const_name, rows):
              marker = f'const {const_name} = ['
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'{const_name} marker not found')
              end = text.find('];', start)
              if end < 0:
                  raise SystemExit(f'{const_name} end not found')
              block = text[start:end]
              for row in rows:
                  name = row[0]
                  if json.dumps(name, ensure_ascii=False) in block:
                      raise SystemExit(f'{const_name}: {name} already exists')
              encoded = json.dumps(rows, ensure_ascii=False, separators=(',', ':'))[1:-1]
              prefix = '' if text[end-1] == '[' else ','
              return text[:end] + prefix + encoded + text[end:]

          s = append_rows(s, 'DRINK_MASTER_SEED', master)
          s = append_rows(s, 'DRINK_COPY_SEED', copy)
          if 'const DRINK_MASTER_ALIASES = [' in s:
              s = append_rows(s, 'DRINK_MASTER_ALIASES', aliases)

          if "'jp-rarity-v1.6'" not in s:
              raise SystemExit('v1.6 runtime version not found')
          s = s.replace("'jp-rarity-v1.6'", "'jp-rarity-v1.7'")
          worker.write_text(s)

          coverage = Path('test/drink-copy-coverage.test.mjs')
          t = coverage.read_text()
          t = t.replace("test('all 50 calibrated drinks have fixed D1 copy'", "test('all 100 calibrated drinks have fixed D1 copy'")
          t = t.replace('assert.equal(master.length,75);', 'assert.equal(master.length,100);')
          coverage.write_text(t)

          master_test = Path('test/drink-master.test.mjs')
          t = master_test.read_text()
          t = t.replace('/jp-rarity-v1\\.6/', '/jp-rarity-v1\\.7/')
          anchor = '  assert.match(source, /パローマ\\\",64,36/);\n'
          if anchor not in t:
              raise SystemExit('drink-master test anchor not found')
          t = t.replace(anchor, anchor + '  assert.match(source, /ソルクバーノ\\\",62,38/);\n  assert.match(source, /ミチェラーダ\\\",38,62/);\n  assert.match(source, /雪国/);\n')
          master_test.write_text(t)
          PY
      - name: Validate
        run: |
          node --check src/worker.mjs
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker.mjs test/drink-copy-coverage.test.mjs test/drink-master.test.mjs
          git commit -m "Expand Japan rarity drink master to 100"
          git push
