name: One-off transition image v3
on:
  push:
    branches: [ux/transition-image-v3]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/transition-image-v3
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('public/assets/css/main.css')
          s=css.read_text(encoding='utf-8')
          old=".choices{display:flex;flex-direction:column;gap:7px;margin-bottom:8px;animation:fadeUp 0.32s ease both;transition:opacity 0.35s ease,transform 0.35s ease;}"
          new=".choices{display:flex;flex-direction:column;gap:7px;margin-bottom:8px;animation:fadeUp 0.35s ease both;transition:opacity 0.18s ease-out,transform 0.18s ease-out;}"
          if old not in s: raise SystemExit('choices transition anchor missing')
          css.write_text(s.replace(old,new,1),encoding='utf-8')
          js=Path('public/assets/js/main.js')
          s=js.read_text(encoding='utf-8')
          s=s.replace("const CHOICE_FADE_MS=350;","const CHOICE_FADE_OUT_MS=180;",1)
          s=s.replace("await sleep(CHOICE_FADE_MS);","await sleep(CHOICE_FADE_OUT_MS);",1)
          s=s.replace("const DRINK_IMG_CACHE_KEY='bar_carila_drink_img_cache_v2';","const DRINK_IMG_CACHE_KEY='bar_carila_drink_img_cache_v3';",1)
          old="async function fetchDrinkImg(name,cat,imgEl,searchName=''){\n  const cached=getCachedDrinkImg(name);\n  if(cached){if(imgEl&&imgEl.src!==cached.url)imgEl.src=cached.url;return;}\n  try{\n    const q=`${searchName||name} ${buildImgQuery(cat)}`.trim();"
          new="async function fetchDrinkImg(name,cat,imgEl,searchName='',imageQuery=''){\n  const cached=getCachedDrinkImg(name);\n  if(cached){if(imgEl&&imgEl.src!==cached.url)imgEl.src=cached.url;return;}\n  try{\n    const q=(imageQuery||`${searchName||name} ${buildImgQuery(cat)}`).trim();"
          if old not in s: raise SystemExit('fetchDrinkImg anchor missing')
          s=s.replace(old,new,1)
          old="if(recImgEl)fetchDrinkImg(data.drink.name,data.drink.category,recImgEl,data.drink.masterKey||'');"
          new="if(recImgEl)fetchDrinkImg(data.drink.name,data.drink.category,recImgEl,data.drink.masterKey||'',data.drink.imageQuery||'');"
          if old not in s: raise SystemExit('showRec image call anchor missing')
          s=s.replace(old,new,1)
          old='"drink":{"name":"正式名称","masterKey":"標準的な英語名","category":"カテゴリ","abv":"約8%のような推定値","rarity":0,"description":"60字以内の説明1文","trivia":"80字以内の豆知識またはBARでの楽しみ方","recipe":{"ingredients":[{"name":"材料","amount":"分量"}],"method":"作り方1文"},"tags":["タグ1","タグ2","タグ3"]}}'
          new='"drink":{"name":"正式名称","masterKey":"標準的な英語名","imageQuery":"写真検索用の英語8語以内。酒名だけにせず色・グラス・主要材料など見た目を表す","category":"カテゴリ","abv":"約8%のような推定値","rarity":0,"description":"60字以内の説明1文","trivia":"80字以内の豆知識またはBARでの楽しみ方","recipe":{"ingredients":[{"name":"材料","amount":"分量"}],"method":"作り方1文"},"tags":["タグ1","タグ2","タグ3"]}}'
          if old not in s: raise SystemExit('final JSON schema anchor missing')
          s=s.replace(old,new,1)
          anchor='・カクテル／モクテルはrecipe必須。単体酒のみrecipe:null可。'
          repl='・imageQueryはUnsplash写真検索専用。英語8語以内で、固有名詞だけにせず色、グラス形状、主要材料、見た目を優先する。例: red grenadine ginger ale mocktail highball glass。\n'+anchor
          if anchor not in s: raise SystemExit('image query rule anchor missing')
          s=s.replace(anchor,repl,1)
          js.write_text(s,encoding='utf-8')
          worker=Path('src/worker.mjs')
          s=worker.read_text(encoding='utf-8')
          s=s.replace("const cacheIdentity = 'v2:' + (normalize(name) || normalize(query));","const cacheIdentity = 'v3:' + (normalize(query) || normalize(name));",1)
          s=s.replace("const searchQuery = [name, query].filter(Boolean).join(' ').trim() || 'cocktail drink';","const searchQuery = (query || name || 'cocktail drink').trim();",1)
          worker.write_text(s,encoding='utf-8')
          test=Path('test/worker.test.mjs')
          s=test.read_text(encoding='utf-8')
          s=s.replace('/const CHOICE_FADE_MS=350/','/const CHOICE_FADE_OUT_MS=180/')
          s=s.replace('/const CHOICE_FADE_MS=220/','/const CHOICE_FADE_OUT_MS=180/')
          s=s.replace("bar_carila_drink_img_cache_v2","bar_carila_drink_img_cache_v3")
          s=s.replace("test('drink image API v2 invalidates generic results and searches with the drink name'","test('drink image API v3 prefers the explicit visual query and invalidates old results'",1)
          s=s.replace("assert.match(source, /const cacheIdentity = 'v2:'/);","assert.match(source, /const cacheIdentity = 'v3:'/);",1)
          s=s.replace("assert.match(source, /\\[name, query\\]\\.filter\\(Boolean\\)\\.join\\(' '\\)/);","assert.match(source, /const searchQuery = \\(query \\|\\| name \\|\\| 'cocktail drink'\\)\\.trim\\(\\)/);",1)
          test.write_text(s,encoding='utf-8')
          PY
      - name: Test
        run: |
          npm ci
          npm test
          npm run validate:drink-master-v1.9
      - name: Commit clean patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-transition-image-v3.yml
          git add public/assets/css/main.css public/assets/js/main.js src/worker.mjs test/worker.test.mjs
          git commit -m 'Refine guided transitions and visual drink image search'
          git push origin HEAD:ux/transition-image-v3
