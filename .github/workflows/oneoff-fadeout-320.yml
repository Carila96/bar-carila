name: One-off fadeout 320ms
on:
  push:
    branches: [ux/slower-choice-fadeout]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/slower-choice-fadeout
      - name: Apply fadeout patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('public/assets/js/main.js')
          s=js.read_text(encoding='utf-8')
          if "const CHOICE_FADE_OUT_MS=180;" not in s: raise SystemExit('js anchor missing')
          s=s.replace("const CHOICE_FADE_OUT_MS=180;","const CHOICE_FADE_OUT_MS=320;",1)
          js.write_text(s,encoding='utf-8')
          css=Path('public/assets/css/main.css')
          s=css.read_text(encoding='utf-8')
          old='transition:opacity 0.18s ease-out,transform 0.18s ease-out;'
          new='transition:opacity 0.32s ease-out,transform 0.32s ease-out;'
          if old not in s: raise SystemExit('css anchor missing')
          s=s.replace(old,new,1)
          css.write_text(s,encoding='utf-8')
          test=Path('test/worker.test.mjs')
          s=test.read_text(encoding='utf-8')
          s=s.replace('/const CHOICE_FADE_OUT_MS=180/','/const CHOICE_FADE_OUT_MS=320/')
          test.write_text(s,encoding='utf-8')
          PY
      - name: Test
        run: |
          npm ci
          npm test
          npm run validate:drink-master-v1.9
      - name: Commit clean patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-fadeout-320.yml
          git add public/assets/js/main.js public/assets/css/main.css test/worker.test.mjs
          git commit -m 'Slow guided choice fade-out'
          git push origin HEAD:ux/slower-choice-fadeout
