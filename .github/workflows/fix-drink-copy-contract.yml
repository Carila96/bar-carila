name: Fix drink copy contract
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Add temporary drink copy contract fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='public/assets/js/main.js';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace(/meta\.shortDescription/g,'meta.description');
          fs.writeFileSync(p,s);
          const t='test/drink-copy.test.mjs';
          let x=fs.readFileSync(t,'utf8');
          x=x.replace(/meta\\\.shortDescription/g,'meta\\.description').replace(/meta\.shortDescription/g,'meta.description');
          fs.writeFileSync(t,x);
          NODE
      - run: npm test
      - run: node --check public/assets/js/main.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/main.js test/drink-copy.test.mjs
          git commit -m "Fix D1 drink copy response contract"
          git push
