name: One-off Sonnet 5 switch

on:
  push:
    branches:
      - perf/sonnet5-latency

permissions:
  contents: write

jobs:
  switch-model:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/sonnet5-latency
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Switch recommendation model to Sonnet 5
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('src/worker.mjs')
          text = worker.read_text(encoding='utf-8')
          old = "const ALLOWED_MODELS = new Set(['claude-sonnet-4-6', 'claude-haiku-4-5-20251001']);"
          new = "const ALLOWED_MODELS = new Set(['claude-sonnet-5', 'claude-sonnet-4-6', 'claude-haiku-4-5-20251001']);"
          if old not in text:
              raise SystemExit('ALLOWED_MODELS target not found')
          text = text.replace(old, new, 1)
          old = "if (body.model === 'claude-sonnet-4-6' && env.DRINK_DB) {"
          new = "if ((body.model === 'claude-sonnet-5' || body.model === 'claude-sonnet-4-6') && env.DRINK_DB) {"
          if old not in text:
              raise SystemExit('lean-output model guard target not found')
          text = text.replace(old, new, 1)
          worker.write_text(text, encoding='utf-8')

          main = Path('public/assets/js/main.js')
          text = main.read_text(encoding='utf-8')
          old = "const RECOMMEND_MODEL='claude-sonnet-4-6';"
          new = "const RECOMMEND_MODEL='claude-sonnet-5';"
          if old not in text:
              raise SystemExit('RECOMMEND_MODEL target not found')
          text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/oneoff-sonnet5-switch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.mjs public/assets/js/main.js .github/workflows/oneoff-sonnet5-switch.yml
          git commit -m "Switch BarCarila recommendations to Claude Sonnet 5"
          git push origin HEAD:perf/sonnet5-latency
