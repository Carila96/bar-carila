name: Apply complete 50-drink copy master
on:
  push:
    branches: [chatgpt/complete-50-copy-master]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Complete D1 copy master coverage
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          p=Path('src/worker.mjs')
          s=p.read_text()
          additions = [
            ["ジントニック","ジンの香りをトニックの苦甘さと炭酸で軽快に楽しむロングカクテル。","爽やか、ほろ苦い、ドライ","迷ったらジンの銘柄指定なしで注文して問題ありません。"],
            ["モスコミュール","ウォッカにライムとジンジャーの刺激を合わせる爽快なロングカクテル。","爽やか、辛口、ジンジャー","ジンジャーの辛さは店差があるため、好みがあれば伝えると安心です。"],
            ["ギムレット","ジンとライムを短く鋭くまとめた、香りと酸味を楽しむショートカクテル。","ドライ、柑橘、シャープ","甘さや酸味のバランスは店ごとの個性が出やすい一杯です。"],
            ["マティーニ","ジンとベルモットを中心に仕上げる、香りとドライさを味わう代表的なショートカクテル。","ドライ、芳香、強め","初めてなら銘柄やドライ加減はバーテンダーに任せても大丈夫です。"],
            ["マルガリータ","テキーラに柑橘とオレンジ系リキュールを合わせ、塩味が輪郭を作る定番カクテル。","柑橘、甘酸っぱい、塩味","グラスの塩が苦手なら塩なしでお願いできます。"],
            ["ダイキリ","ラム、ライム、甘味をシンプルにまとめた、爽やかでキレのあるショートカクテル。","爽やか、甘酸っぱい、ドライ","甘さと酸味の加減に希望があれば一言伝えると調整してもらえます。"],
            ["サイドカー","ブランデーに柑橘とオレンジ系リキュールを合わせる、芳醇で端正なショートカクテル。","芳醇、柑橘、甘酸っぱい","ブランデーの銘柄指定がなければ店の標準で任せて問題ありません。"],
            ["ソルティドッグ","ウォッカとグレープフルーツに塩のアクセントを合わせる定番カクテル。","爽やか、ほろ苦い、塩味","塩の縁は好みなので、不要なら塩なしでも頼めます。"],
            ["ブラッディメアリー","ウォッカとトマトを軸に、店ごとの味付けも楽しめるロングカクテル。","旨味、酸味、スパイシー","辛さやスパイス感は店によって違うので好みを伝えても構いません。"],
            ["マンハッタン","ウイスキーとベルモット、ビターズを合わせる、甘苦く芳醇なクラシックカクテル。","芳醇、甘苦い、強め","ベースのウイスキーや甘さは店のスタイルに任せても楽しめます。"],
            ["モヒート","ラム、ライム、ミント、甘味とソーダを合わせる清涼感の強いカクテル。","爽快、ミント、甘酸っぱい","生ミントの在庫で作れないことがあるため、なければ近い方向で相談できます。"],
            ["カンパリソーダ","カンパリをソーダで割り、薬草系の苦味を軽快に楽しむシンプルな一杯。","ほろ苦い、爽快、ハーブ","苦味が好きならそのまま、柔らかめがよければ相談できます。"],
            ["キューバリバー","ラムとコーラにライムを合わせる、親しみやすいロングカクテル。","甘め、爽快、コーラとライム","キューバリバー、またはキューバリブレの呼び方で通じることが多い一杯です。"],
            ["カルーアミルク","コーヒーリキュールをミルクでまろやかに仕上げる、甘く飲みやすいロングカクテル。","甘い、コーヒー、まろやか","甘めが好みの初心者でも頼みやすい定番です。"],
            ["ジンフィズ","ジンに柑橘と甘味、ソーダを合わせるクラシックなロングカクテル。","爽やか、甘酸っぱい、軽快","酸味や甘さの好みを一言伝えると調整してもらいやすい一杯です。"],
            ["ジンリッキー","ジンとライムをソーダで伸ばす、甘味を抑えたシンプルなロングカクテル。","ドライ、爽快、柑橘","甘くないものがよければそのまま注文しやすい一杯です。"],
            ["ミモザ","スパークリングワインとオレンジを合わせる、軽やかで親しみやすい一杯。","フルーティ、軽快、爽やか","食前や昼の一杯にも向きますが、スパークリングの常備状況で提供可否が変わります。"],
            ["シャンディガフ","ビールとジンジャーエールを合わせる、軽快で飲みやすいビアカクテル。","爽快、軽い、ジンジャー","アルコール感を抑えたい時にも頼みやすい一杯です。"],
            ["レッドアイ","ビールとトマトを合わせる、軽い酸味と旨味を楽しむビアカクテル。","軽い、トマト、爽やか","トマトジュースの常備がある店なら比較的頼みやすい一杯です。"],
            ["ネグローニ","ジン、カンパリ、ベルモットを等分で合わせる、苦味と甘味が力強いクラシック。","苦い、ハーブ、芳醇","苦味が主役なので、カンパリ系が好きなら頼みやすい一杯です。"],
            ["オールドファッションド","ウイスキーを甘味とビターズで整え、ゆっくり味わうクラシックカクテル。","濃厚、ほろ苦い、ウイスキー主体","ベースのウイスキーに希望があれば銘柄やスタイルを相談できます。"],
            ["アレキサンダー","ブランデー系の芳醇さをカカオとクリームで包む、滑らかなショートカクテル。","甘い、クリーミー、カカオ","デザート感覚で楽しみたい時に向く一杯です。"],
            ["ベリーニ","スパークリングワインに桃の風味を合わせる、華やかで柔らかなカクテル。","フルーティ、桃、軽快","桃の材料やスパークリングの在庫で提供可否が変わることがあります。"],
            ["テキーラサンライズ","テキーラとオレンジにグレナデンの甘味を重ねる、見た目も華やかなロングカクテル。","フルーティ、甘め、柑橘","甘めがよければそのまま、軽くしたい場合は相談できます。"],
            ["スクリュードライバー","ウォッカとオレンジを合わせる、シンプルで果実感のあるロングカクテル。","フルーティ、甘酸っぱい、軽快","材料がシンプルなので味の好みを伝えて調整してもらいやすい一杯です。"],
            ["ホワイトルシアン","ウォッカとコーヒーリキュールにクリームを重ねる、濃厚で甘いカクテル。","甘い、コーヒー、クリーミー","食後酒感覚でゆっくり飲みたい時に向きます。"],
            ["ブラックルシアン","ウォッカとコーヒーリキュールを合わせる、甘さとアルコール感の強いカクテル。","甘い、コーヒー、強め","見た目以上にアルコール感があるのでゆっくり楽しむのがおすすめです。"],
            ["シンガポールスリング","ジンを軸に果実味やリキュールを重ねる、華やかなロングカクテル。","フルーティ、甘酸っぱい、複雑","店ごとにレシピ差が大きいので、その店のスタイルを楽しむ一杯です。"],
            ["フレンチ75","ジンと柑橘をスパークリングワインで仕上げる、華やかで切れのあるカクテル。","爽やか、華やか、ドライ","スパークリングを扱うバーなら相談しやすい一杯です。"],
            ["キール","白ワインにカシスを合わせる、甘酸っぱく軽やかなワインカクテル。","甘酸っぱい、ベリー、軽快","食前酒としても頼みやすい一杯です。"],
            ["キールロワイヤル","スパークリングワインにカシスを合わせる、華やかなワインカクテル。","ベリー、華やか、軽快","スパークリングを常備する店で頼みやすい一杯です。"],
            ["ラスティネイル","スコッチにドランブイを合わせる、蜂蜜やハーブの甘さを持つクラシック。","甘い、ハーブ、ウイスキー","ドランブイを置いているかで提供可否が分かれます。"],
            ["ゴッドファーザー","ウイスキーにアマレットを合わせる、ナッツのような甘さを持つシンプルな一杯。","甘い、ナッツ、ウイスキー","アマレットがあれば比較的作りやすく、銘柄指定なしでも頼めます。"],
            ["ロブロイ","スコッチを使って仕立てるマンハッタン系のクラシックカクテル。","芳醇、甘苦い、スコッチ","スコッチの銘柄やスタイルは店に任せても楽しめます。"],
            ["アペロールスプリッツ","アペロール、スパークリングワイン、ソーダを合わせる、ほろ苦く軽快な食前酒。","ほろ苦い、柑橘、軽快","日本では店差があるため、アペロールスプリッツが作れるか先に確認すると確実です。"],
            ["ブロンクス","ジン、ベルモット、オレンジを合わせる、柑橘の柔らかさを持つクラシック。","柑橘、芳香、ややドライ","クラシックを多く扱うバーなら相談しやすい一杯です。"],
            ["ロングアイランドアイスティー","複数のスピリッツと柑橘、コーラを合わせる、飲みやすさに反して強いロングカクテル。","甘酸っぱい、コーラ、強め","見た目より度数が高くなりやすいので、ゆっくり楽しんでください。"],
            ["グラスホッパー","ミントとカカオ、クリームを合わせる、甘く滑らかなデザート系カクテル。","甘い、ミント、カカオ","リキュールの在庫で店差があるため、なければ近いデザート系を相談できます。"],
            ["パローマ","テキーラにグレープフルーツ系の爽やかさを合わせる、軽快なロングカクテル。","爽やか、柑橘、ほろ苦い","日本では店差があるため、パローマが可能か一言確認すると確実です。"],
            ["ミントジュレップ","バーボンにミントと甘味を合わせ、たっぷりの氷で楽しむ爽快なカクテル。","ミント、爽快、ウイスキー","生ミントの在庫や季節で作れないことがあるため確認がおすすめです。"],
            ["カイピリーニャ","カシャッサとライム、砂糖を合わせる、力強い柑橘感のブラジル由来カクテル。","ライム、甘酸っぱい、力強い","カシャッサを常備している店かどうかで提供可否が大きく分かれます。"],
            ["マイタイ","ラムを軸に柑橘や甘味を重ねる、香り豊かなトロピカルカクテル。","トロピカル、甘酸っぱい、ラム","店によってレシピが大きく異なるので、その店のマイタイを楽しむ感覚で頼めます。"],
            ["ピニャコラーダ","ラム、パイナップル、ココナッツを合わせる、濃厚で南国感のあるカクテル。","甘い、トロピカル、クリーミー","ココナッツ系材料の常備で店差があるため、作れるか確認すると確実です。"],
            ["ピスコサワー","ピスコに柑橘と甘味を合わせ、泡の口当たりを楽しむ南米のクラシック。","甘酸っぱい、芳香、滑らか","日本ではピスコを置く店が限られるため、注文前に確認がおすすめです。"],
            ["アメリカーノ","カンパリとベルモットをソーダで伸ばす、ほろ苦く軽快なクラシック。","ほろ苦い、ハーブ、軽快","材料が揃えば作りやすく、苦味を軽く楽しみたい時に向きます。"],
            ["サゼラック","ライウイスキーなどにビターズとアブサン系の香りを重ねる、力強いクラシック。","スパイシー、ハーブ、強め","ペイショーズビターズやアブサン系の常備で店差があるため確認がおすすめです。"],
            ["コープスリバイバー No.2","ジン、柑橘、オレンジ系リキュールなどを合わせる、香り高くシャープなクラシック。","柑橘、芳香、ドライ","複数の特殊材料が必要なので、クラシックを得意とするバーで確認するのが確実です。"],
            ["ラモスジンフィズ","ジン、柑橘、乳製品などを丁寧に泡立てる、滑らかで手間のかかるクラシック。","クリーミー、柑橘、滑らか","時間のかかるカクテルなので、混雑時を避けて作れるか確認するのがおすすめです。"],
            ["ヴューカレ","ライ、コニャック、ベルモット、リキュール、ビターズを重ねる複雑なクラシック。","芳醇、スパイシー、複雑","特殊材料が多いため、クラシックに強いバーで作れるか確認すると確実です。"],
            ["トリニダードサワー","ビターズを主役級に使い、柑橘や甘味と合わせる個性的なサワースタイル。","ビター、スパイシー、個性的","一般的なバーでは珍しいため、作れるか、近い方向の一杯があるか相談するのがおすすめです。"]
          ]
          marker='const DRINK_COPY_SEED = ['
          start=s.index(marker)+len(marker)
          end=s.index('];',start)
          body=s[start:end]
          existing=set()
          for item in additions:
              if json.dumps(item[0], ensure_ascii=False) in body:
                  existing.add(item[0])
          missing=[x for x in additions if x[0] not in existing]
          if missing:
              payload=','.join(json.dumps(x,ensure_ascii=False,separators=(',',':')) for x in missing)
              if body.strip(): payload=','+payload
              s=s[:end]+payload+s[end:]
              p.write_text(s)
          print(f'copy entries already present: {len(existing)}, added: {len(missing)}')
          PY
          cat > test/drink-copy-coverage.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const source=fs.readFileSync(new URL('../src/worker.mjs',import.meta.url),'utf8');
          function namesFromArray(constName){
            const marker=`const ${constName} = [`;
            const start=source.indexOf(marker);
            assert.notEqual(start,-1,`${constName} missing`);
            const end=source.indexOf('];',start);
            const text=source.slice(start+marker.length,end);
            return [...text.matchAll(/\["([^"]+)"/g)].map(m=>m[1]);
          }
          test('all 50 calibrated drinks have fixed D1 copy',()=>{
            const master=[...new Set(namesFromArray('DRINK_MASTER_SEED'))];
            const copy=new Set(namesFromArray('DRINK_COPY_SEED'));
            assert.equal(master.length,50);
            const missing=master.filter(name=>!copy.has(name));
            assert.deepEqual(missing,[]);
          });
          EOF
      - name: Validate
        run: |
          node --check src/worker.mjs
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.mjs test/drink-copy-coverage.test.mjs
          git commit -m "Complete fixed copy for calibrated 50 drinks"
          git push origin chatgpt/complete-50-copy-master
