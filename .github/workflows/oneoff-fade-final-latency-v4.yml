name: One-off fade final latency v4
on:
  push:
    branches:
      - ux/fade-and-final-latency-v3
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/fade-and-final-latency-v3
      - name: Apply patch
        run: |
          python scripts/oneoff_fade_latency_patch.py
      - name: Test
        run: |
          npm ci
          npm test
          npm run validate:drink-master-v1.9
      - name: Commit
        run: |
          rm -f .github/workflows/oneoff-fade-final-latency-v3.yml .github/workflows/oneoff-fade-final-latency-v4.yml scripts/oneoff_fade_latency_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Smooth guided transitions and trim final request"
          git push origin HEAD:ux/fade-and-final-latency-v3
