name: One-off integrate drink master batch 02
on:
  push:
    branches: [data/drink-master-expansion-b02]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/drink-master-expansion-b02
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch v1.9 runtime for batch 02
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/worker-v1.9.mjs')
          s=p.read_text()
          old="import { DRINK_MASTER_EXPANSION_B01, DRINK_MASTER_EXPANSION_B01_SEED_ROWS, DRINK_MASTER_EXPANSION_B01_ALIAS_ENTRIES, DRINK_MASTER_EXPANSION_B01_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B01_EVALUATED_AT } from './drink-master-expansion-b01.mjs';"
          new=old+"\nimport { DRINK_MASTER_EXPANSION_B02, DRINK_MASTER_EXPANSION_B02_SEED_ROWS, DRINK_MASTER_EXPANSION_B02_ALIAS_ENTRIES, DRINK_MASTER_EXPANSION_B02_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B02_EVALUATED_AT } from './drink-master-expansion-b02.mjs';"
          if old not in s: raise SystemExit('import marker missing')
          s=s.replace(old,new,1)
          old="const V19_BY_KEY = new Map([...JP_RARITY_V19_SEED_ROWS, ...DRINK_MASTER_EXPANSION_B01_SEED_ROWS].map((row) => [normalizeDrinkV19Key(row[0]), row]));"
          new="const V19_BY_KEY = new Map([...JP_RARITY_V19_SEED_ROWS, ...DRINK_MASTER_EXPANSION_B01_SEED_ROWS, ...DRINK_MASTER_EXPANSION_B02_SEED_ROWS].map((row) => [normalizeDrinkV19Key(row[0]), row]));"
          if old not in s: raise SystemExit('V19 marker missing')
          s=s.replace(old,new,1)
          old="for (const [alias, masterKey] of DRINK_MASTER_EXPANSION_B01_ALIAS_ENTRIES) {\n  LOOKUP_ALIASES.set(normalizeDrinkV19Key(alias), normalizeDrinkV19Key(masterKey));\n}\nconst ACCEPTED_EVIDENCE_VERSIONS = new Set([EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B01_EVIDENCE_VERSION]);"
          new="for (const [alias, masterKey] of DRINK_MASTER_EXPANSION_B01_ALIAS_ENTRIES) {\n  LOOKUP_ALIASES.set(normalizeDrinkV19Key(alias), normalizeDrinkV19Key(masterKey));\n}\nfor (const [alias, masterKey] of DRINK_MASTER_EXPANSION_B02_ALIAS_ENTRIES) {\n  LOOKUP_ALIASES.set(normalizeDrinkV19Key(alias), normalizeDrinkV19Key(masterKey));\n}\nconst ACCEPTED_EVIDENCE_VERSIONS = new Set([EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B01_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B02_EVIDENCE_VERSION]);"
          if old not in s: raise SystemExit('alias marker missing')
          s=s.replace(old,new,1)
          marker="async function seedV19IfNeeded(env) {"
          insert=r'''async function hasExpansionB02Seed(env) {
  if (!env?.DRINK_DB) return false;
  try {
    const row = await env.DRINK_DB.prepare(`SELECT COUNT(*) AS count FROM drinks WHERE evidence_version = ?`)
      .bind(DRINK_MASTER_EXPANSION_B02_EVIDENCE_VERSION).first();
    return Number(row?.count || 0) >= DRINK_MASTER_EXPANSION_B02.length;
  } catch {
    return false;
  }
}

async function seedExpansionB02(env) {
  if (!env?.DRINK_DB) return;
  await ensureV19Tables(env);
  const statements = DRINK_MASTER_EXPANSION_B02.map((drink) => {
    const key = normalizeDrinkV19Key(drink.masterKey);
    return env.DRINK_DB.prepare(`INSERT INTO drinks (
      canonical_key, name_ja, name_en, category, base_spirit, drink_kind,
      japan_availability_score, japan_rarity_score, japan_rarity_label, japan_rarity_confidence,
      rarity_reason, evidence_version, evaluated_at, short_description, order_hint, updated_at
    ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, datetime('now'))
    ON CONFLICT(canonical_key) DO UPDATE SET
      name_ja = excluded.name_ja,
      name_en = excluded.name_en,
      category = excluded.category,
      base_spirit = excluded.base_spirit,
      drink_kind = excluded.drink_kind,
      japan_availability_score = excluded.japan_availability_score,
      japan_rarity_score = excluded.japan_rarity_score,
      japan_rarity_label = excluded.japan_rarity_label,
      japan_rarity_confidence = excluded.japan_rarity_confidence,
      rarity_reason = excluded.rarity_reason,
      evidence_version = excluded.evidence_version,
      evaluated_at = excluded.evaluated_at,
      short_description = excluded.short_description,
      order_hint = excluded.order_hint,
      updated_at = datetime('now')`)
      .bind(key, drink.nameJa, drink.masterKey, drink.category, drink.baseSpirit, drink.drinkKind,
        drink.availability, drink.rarity, drink.rarityLabel, drink.confidence, drink.rarityReason,
        DRINK_MASTER_EXPANSION_B02_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B02_EVALUATED_AT,
        drink.shortDescription, drink.orderHint);
  });
  if (statements.length) await env.DRINK_DB.batch(statements);
  for (const drink of DRINK_MASTER_EXPANSION_B02) {
    const key = normalizeDrinkV19Key(drink.masterKey);
    const row = await env.DRINK_DB.prepare(`SELECT id FROM drinks WHERE canonical_key = ? LIMIT 1`).bind(key).first();
    if (!row?.id) continue;
    const aliasStatements = [drink.nameJa, ...drink.aliases].map((alias) => env.DRINK_DB.prepare(`INSERT INTO drink_aliases (
      alias_key, drink_id, alias_text, language
    ) VALUES (?, ?, ?, ?)
    ON CONFLICT(alias_key) DO UPDATE SET drink_id = excluded.drink_id, alias_text = excluded.alias_text, language = excluded.language`)
      .bind(normalizeDrinkV19Key(alias), row.id, alias, /[\u3040-\u30ff\u3400-\u9fff]/.test(alias) ? 'ja' : 'en'));
    if (aliasStatements.length) await env.DRINK_DB.batch(aliasStatements);
    for (const evidence of drink.evidence) {
      const exists = await env.DRINK_DB.prepare(`SELECT id FROM drink_evidence WHERE drink_id = ? AND source_url = ? LIMIT 1`)
        .bind(row.id, evidence.url).first();
      if (exists?.id) continue;
      await env.DRINK_DB.prepare(`INSERT INTO drink_evidence (
        drink_id, evidence_type, source_title, source_url, source_note, observed_at, weight
      ) VALUES (?, ?, ?, ?, ?, ?, ?)`)
        .bind(row.id, evidence.type, evidence.title, evidence.url, evidence.note, DRINK_MASTER_EXPANSION_B02_EVALUATED_AT, 'supporting').run();
    }
  }
}

'''
          if marker not in s: raise SystemExit('seed marker missing')
          s=s.replace(marker,insert+marker,1)
          old="  if (!(await hasExpansionB01Seed(env))) await seedExpansionB01(env);"
          new=old+"\n  if (!(await hasExpansionB02Seed(env))) await seedExpansionB02(env);"
          if old not in s: raise SystemExit('seed call marker missing')
          s=s.replace(old,new,1)
          old="export { JP_RARITY_V19_SEED_ROWS as V19_ROWS, rarityLabel, rarityReason, canonicalLookupKey, enrichV19Response, hasCurrentV19Seed, hasExpansionB01Seed };"
          new="export { JP_RARITY_V19_SEED_ROWS as V19_ROWS, rarityLabel, rarityReason, canonicalLookupKey, enrichV19Response, hasCurrentV19Seed, hasExpansionB01Seed, hasExpansionB02Seed };"
          if old not in s: raise SystemExit('export marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm test
      - run: npm run validate:drink-master-v1.9
      - name: Commit integrated batch and remove one-off workflow
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-integrate-drink-master-b02.yml
          git add -A
          git commit -m 'Integrate drink master expansion batch 02' || true
          git push origin HEAD:data/drink-master-expansion-b02 || true
