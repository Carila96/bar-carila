name: One-off integrate drink master batch 02
on:
  push:
    branches: [data/drink-master-expansion-b02]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/drink-master-expansion-b02
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/integrate-drink-master-b02.py
      - run: npm test
      - run: npm run validate:drink-master-v1.9
      - name: Commit integrated batch and remove one-off files
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-integrate-drink-master-b02.yml scripts/integrate-drink-master-b02.py
          git add -A
          git commit -m 'Integrate drink master expansion batch 02' || true
          git push origin HEAD:data/drink-master-expansion-b02 || true
