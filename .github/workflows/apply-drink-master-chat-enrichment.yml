name: Apply drink master chat enrichment
on:
  push:
    branches: [chatgpt/drink-master-chat-enrichment]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch worker and frontend
        run: |
          python3 <<'PY'
          from pathlib import Path

          wp=Path('src/worker.mjs')
          w=wp.read_text()
          marker='function cacheStaticAsset(response, pathname) {'
          if 'async function enrichBarCarilaRecommendation' not in w:
              helper='''async function enrichBarCarilaRecommendation(data, env) {
            const textItem = data?.content?.find((item) => item?.type === 'text' && typeof item.text === 'string');
            if (!textItem || !env.DRINK_DB) return data;
            let parsed;
            try { parsed = JSON.parse(textItem.text.replace(/```json|```/g, '').trim()); } catch { return data; }
            if (parsed?.type !== 'recommendation' || !parsed?.drink?.name) return data;
            let row;
            try { row = await readDrinkMaster(env, parsed.drink.name); } catch (error) {
              console.error('D1 drink master enrichment failed', error);
              return data;
            }
            if (!row) return data;
            if (Number.isFinite(row.japan_rarity_score)) parsed.drink.rarity = row.japan_rarity_score;
            parsed.drink.rarityLabel = row.japan_rarity_label || '';
            parsed.drink.rarityConfidence = row.japan_rarity_confidence ?? null;
            parsed.drink.rarityReason = row.rarity_reason || '';
            if (row.short_description) parsed.drink.description = row.short_description;
            if (row.order_hint) parsed.drink.trivia = row.order_hint;
            parsed.drink.masterSource = 'd1';
            parsed.drink.evidenceVersion = row.evidence_version || '';
            textItem.text = JSON.stringify(parsed);
            return data;
          }

          '''
              if marker not in w:
                  raise SystemExit('worker helper insertion marker not found')
              w=w.replace(marker,helper+marker,1)

          chat_start=w.index('async function chat(request, env) {')
          ret_start=w.index('  return new Response(upstream.body, {',chat_start)
          ret_end=w.index('\n  });',ret_start)+len('\n  });')
          w=w[:ret_start]+"  const data = await upstream.json();\n  await enrichBarCarilaRecommendation(data, env);\n  return json(data, upstream.status);"+w[ret_end:]
          wp.write_text(w)

          jp=Path('public/assets/js/main.js')
          j=jp.read_text()
          j=j.replace('const maxTokens=fastTurn?600:1100;','const maxTokens=fastTurn?600:1000;',1)
          j=j.replace('"description":"説明2〜3文。飲み方含む"','"description":"フォールバック用の短い説明1文（60字以内）"',1)
          needle='カクテルはrecipe必須。単体酒のみrecipe:null可。abv・rarityは必ず含める。triviaはカクテル・モクテル・ノンアルはカクテルtriviaルール参照（省略可）。単体酒のtriviaには飲み方を必ず含める。'
          extra=needle+'\n固定情報は簡潔にする。descriptionは1文60字以内、triviaは必要な場合のみ1文80字以内。酒の一般説明や注文上の注意はD1酒マスターで補完されるため長文にしない。'
          if needle in j and '固定情報は簡潔にする。descriptionは1文60字以内' not in j:
              j=j.replace(needle,extra,1)
          apply="  const cached=getCachedDrinkMeta(data?.drink?.name);if(cached)apply(cached);\n  fetch(DRINK_META_API+'?name='+encodeURIComponent(data.drink.name))"
          replacement="  if(data?.drink?.masterSource==='d1'){apply(data.drink);return;}\n  const cached=getCachedDrinkMeta(data?.drink?.name);if(cached)apply(cached);\n  fetch(DRINK_META_API+'?name='+encodeURIComponent(data.drink.name))"
          if apply in j:
              j=j.replace(apply,replacement,1)
          elif "masterSource==='d1'" not in j:
              raise SystemExit('frontend drink meta apply block not found')
          jp.write_text(j)

          tp=Path('test/drink-copy.test.mjs')
          t=tp.read_text()
          if 'masterSource' not in t:
              t=t.replace('assert.match(j,/meta.description/);',"assert.match(j,/meta.description/);assert.match(w,/enrichBarCarilaRecommendation/);assert.match(w,/masterSource = 'd1'/);assert.match(j,/masterSource==='d1'/);assert.match(j,/const maxTokens=fastTurn\\?600:1000/);",1)
          tp.write_text(t)
          PY
      - name: Validate
        run: |
          node --check src/worker.mjs
          node --check public/assets/js/main.js
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.mjs public/assets/js/main.js test/drink-copy.test.mjs
          git commit -m "Enrich BarCarila recommendations from D1"
          git push origin chatgpt/drink-master-chat-enrichment
