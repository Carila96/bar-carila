name: Patch drink master

on:
  push:
    branches:
      - chatgpt/d1-drink-master-phase1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot drink master patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/d1-drink-master-phase1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node scripts/patch-drink-master.cjs
      - name: Test
        run: npm test
      - name: Syntax check
        run: node --check src/worker.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.mjs test/drink-master.test.mjs
          git commit -m "Add D1 drink master phase 1"
          git push
