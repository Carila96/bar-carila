name: Apply Japan rarity v1.6 expand 75
on:
  push:
    branches: [chatgpt/japan-rarity-v1-6-expand-75]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Expand calibrated drink master to 75
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          p=Path('src/worker.mjs')
          s=p.read_text()

          master_add = [
            ["ホワイトレディ",88,12,"定番",0.93,"日本のスタンダード群で、複数の現行BARメニューに確認でき、基本材料で成立しやすい。"],
            ["バラライカ",82,18,"比較的よくある",0.90,"日本側スタンダード群で、複数の現行BARに提供例がある。"],
            ["アイリッシュコーヒー",70,30,"やや珍しい",0.86,"日本側スタンダードだが、温製・コーヒー・クリーム等の提供オペレーションで店差が出る。"],
            ["ウイスキーサワー",72,28,"比較的よくある",0.86,"国内の複数BARで現行提供され、材料は一般的だが最上位定番より名称注文頻度は低い。"],
            ["トムコリンズ",68,32,"やや珍しい",0.84,"国内の複数BARで現行提供。基本材料で成立しやすいが一般認知は定番群より低い。"],
            ["ジンバック",78,22,"比較的よくある",0.90,"一般BARからダイニングBARまで現行提供が多く、材料も非常に一般的。"],
            ["アビエーション",45,55,"珍しい",0.78,"クラシックBARでは成立するが、マラスキーノやバイオレット系材料の常備が制約。"],
            ["ブルームーン",55,45,"やや珍しい",0.82,"複数の国内クラシックBARで現行提供されるが、バイオレット系材料常備で店差が出る。"],
            ["コスモポリタン",64,36,"やや珍しい",0.85,"複数の国内BARで現行提供されるが、クランベリー等の常備に一部店差がある。"],
            ["カミカゼ",66,34,"やや珍しい",0.85,"複数の国内BARで現行提供され、基本的なショートカクテルとして成立しやすい。"],
            ["ゴッドマザー",56,44,"やや珍しい",0.80,"現行BARで提供例があり材料も比較的容易だが、一般定番としての密度は中程度。"],
            ["フレンチコネクション",62,38,"やや珍しい",0.84,"複数の国内BARで現行提供され、材料も比較的シンプル。"],
            ["スティンガー",58,42,"やや珍しい",0.83,"複数の国内クラシックBARで現行提供されるが、ミント系リキュール常備が店差要因。"],
            ["B-52",45,55,"珍しい",0.76,"国内BARで現行提供例はあるが、複数リキュールとレイヤー技法で一般成立性は中低。"],
            ["カシスオレンジ",90,10,"定番",0.95,"専門BARから一般ダイニングBARまで非常に広く現行提供され、材料・技法とも容易。"],
            ["スプモーニ",82,18,"比較的よくある",0.92,"国内の多業態で現行提供され、材料流通も良好。"],
            ["ファジーネーブル",86,14,"定番",0.93,"一般ダイニングBARからホテルBARまで広く現行提供され、材料も一般的。"],
            ["チャイナブルー",80,20,"比較的よくある",0.90,"国内の多業態で現行提供され、ライチ・ブルーキュラソー常備でわずかに店差。"],
            ["スプリッツァー",72,28,"比較的よくある",0.86,"国内BARで複数提供例があり、白ワインとソーダで成立しやすい。"],
            ["キティ",74,26,"比較的よくある",0.87,"国内BARで複数提供例があり、赤ワインとジンジャーで作りやすい。"],
            ["オペレーター",72,28,"比較的よくある",0.86,"国内BARで複数提供例があり、白ワインとジンジャーで成立しやすい。"],
            ["カリモーチョ",65,35,"やや珍しい",0.82,"材料は容易で国内提供例もあるが、名称認知・注文頻度はキティ等より低い。"],
            ["XYZ",72,28,"比較的よくある",0.86,"国内の複数BARで現行提供され、基本材料でクラシックBARでは成立しやすい。"],
            ["オレンジブロッサム",76,24,"比較的よくある",0.87,"国内の複数BARで現行提供され、ジンとオレンジ中心で材料制約が少ない。"],
            ["シーブリーズ",72,28,"比較的よくある",0.85,"国内BARで現行提供例があり技法は容易だが、クランベリー常備で店差がある。"]
          ]

          copy_add = [
            ["ホワイトレディ","ジンにオレンジ系リキュールとレモンを合わせる、シャープで端正なショートカクテル。","ドライ、柑橘、甘酸っぱい","初めてなら甘さや酸味は店のバランスに任せて問題ありません。"],
            ["バラライカ","ウォッカにオレンジ系リキュールとレモンを合わせる、すっきりしたショートカクテル。","すっきり、柑橘、甘酸っぱい","ウォッカの銘柄指定なしで注文して問題ありません。"],
            ["アイリッシュコーヒー","アイリッシュウイスキーと温かいコーヒー、甘味、クリームを合わせる食後向きの一杯。","温かい、コーヒー、まろやか","コーヒー設備や提供時間の都合で作れない店もあるため確認すると確実です。"],
            ["ウイスキーサワー","ウイスキーに柑橘と甘味を合わせる、酸味とコクのバランスを楽しむカクテル。","甘酸っぱい、ウイスキー、爽やか","卵白を使うスタイルもあるので、気になる場合は店のレシピを確認できます。"],
            ["トムコリンズ","ジンにレモンと甘味を加えソーダで伸ばす、爽快なロングカクテル。","爽やか、甘酸っぱい、軽快","甘さを控えたい場合は一言伝えると調整してもらいやすい一杯です。"],
            ["ジンバック","ジンをジンジャーエールと柑橘で仕上げる、親しみやすいロングカクテル。","爽快、ジンジャー、柑橘","ジンジャーの辛さは店差があるため好みを伝えても構いません。"],
            ["アビエーション","ジンにマラスキーノやバイオレット系の香り、柑橘を重ねるクラシック。","フローラル、柑橘、ドライ","特殊なリキュールが必要なので、作れるか先に確認すると確実です。"],
            ["ブルームーン","ジンにバイオレット系リキュールと柑橘を合わせる、花の香りが印象的なショートカクテル。","フローラル、甘酸っぱい、ややドライ","バイオレット系リキュールの在庫で提供可否が分かれます。"],
            ["コスモポリタン","ウォッカにクランベリーと柑橘を合わせる、華やかで軽快なショートカクテル。","フルーティ、甘酸っぱい、爽やか","クランベリーの在庫があれば比較的相談しやすい一杯です。"],
            ["カミカゼ","ウォッカにオレンジ系リキュールとライムを合わせる、鋭い酸味のショートカクテル。","シャープ、柑橘、甘酸っぱい","酸味が強めなので、柔らかくしたい場合は相談できます。"],
            ["ゴッドマザー","ウォッカにアマレットを合わせる、ナッツのような甘い香りを持つシンプルな一杯。","甘い、ナッツ、まろやか","アマレットがあれば作りやすく、銘柄指定なしで頼めます。"],
            ["フレンチコネクション","ブランデーとアマレットを合わせる、芳醇さとナッツの甘香ばしさを楽しむ一杯。","芳醇、甘い、ナッツ","ブランデーの銘柄指定がなければ店の標準に任せて問題ありません。"],
            ["スティンガー","ブランデーにミント系リキュールを合わせる、芳醇さと清涼感を持つクラシック。","ミント、芳醇、甘め","ミント系リキュールの在庫で作れないことがあります。"],
            ["B-52","コーヒー、クリーム、オレンジ系のリキュールを層にして楽しむ甘いショットカクテル。","甘い、コーヒー、クリーミー","レイヤーで作るため、混雑時などは提供可否を確認すると確実です。"],
            ["カシスオレンジ","カシスリキュールをオレンジジュースで割る、甘酸っぱく親しみやすい定番。","甘い、ベリー、オレンジ","初心者でもそのまま名前で頼みやすい一杯です。"],
            ["スプモーニ","カンパリ、グレープフルーツ、トニックを合わせる、ほろ苦く爽快なロングカクテル。","ほろ苦い、爽やか、柑橘","苦味を少し抑えたい場合は一言相談できます。"],
            ["ファジーネーブル","ピーチリキュールとオレンジを合わせる、甘くフルーティなロングカクテル。","甘い、桃、オレンジ","甘めで飲みやすいものを求める時にそのまま頼みやすい一杯です。"],
            ["チャイナブルー","ライチの香りにグレープフルーツと青い柑橘系リキュールを合わせる爽やかな一杯。","ライチ、柑橘、爽やか","ライチ系リキュールを置く店なら比較的相談しやすい一杯です。"],
            ["スプリッツァー","白ワインをソーダで軽快に伸ばす、シンプルなワインカクテル。","軽快、ドライ、爽やか","軽めに飲みたい時に頼みやすく、白ワインがあれば成立しやすい一杯です。"],
            ["キティ","赤ワインをジンジャーエールで割る、果実味と甘さのあるワインカクテル。","フルーティ、甘め、軽快","赤ワインとジンジャーがあれば作りやすく、気軽に頼めます。"],
            ["オペレーター","白ワインをジンジャーエールで割る、爽やかで軽いワインカクテル。","爽やか、やや甘い、軽快","白ワインとジンジャーがあれば比較的作りやすい一杯です。"],
            ["カリモーチョ","赤ワインとコーラを合わせる、果実味と甘さのある気軽なワインカクテル。","甘め、コーラ、フルーティ","名前が通じない場合は赤ワインのコーラ割りと伝えても構いません。"],
            ["XYZ","ラムにオレンジ系リキュールとレモンを合わせる、キレのあるショートカクテル。","柑橘、甘酸っぱい、シャープ","クラシックを扱うバーなら名前で相談しやすい一杯です。"],
            ["オレンジブロッサム","ジンとオレンジを合わせる、果実感があり親しみやすいカクテル。","オレンジ、爽やか、やや甘い","材料がシンプルなので、甘さや濃さは相談しやすい一杯です。"],
            ["シーブリーズ","ウォッカにクランベリーとグレープフルーツを合わせる、軽快で甘酸っぱいロングカクテル。","甘酸っぱい、爽やか、フルーティ","クランベリーの在庫があるかで提供可否が分かれることがあります。"]
          ]

          def append_rows(source, const_name, rows):
              marker=f'const {const_name} = ['
              start=source.find(marker)
              if start < 0:
                  raise SystemExit(f'{const_name} marker missing')
              end=source.find('];', start)
              if end < 0:
                  raise SystemExit(f'{const_name} end missing')
              block=source[start:end]
              existing=set()
              import re
              existing.update(re.findall(r'\["([^"]+)"', block))
              pending=[r for r in rows if r[0] not in existing]
              if not pending:
                  return source
              addition=','.join(json.dumps(r, ensure_ascii=False, separators=(',',':')) for r in pending)
              if block.rstrip().endswith('['):
                  insert=addition
              else:
                  insert=','+addition
              return source[:end]+insert+source[end:]

          s=append_rows(s,'DRINK_MASTER_SEED',master_add)
          s=append_rows(s,'DRINK_COPY_SEED',copy_add)
          s=s.replace("jp-rarity-v1.5","jp-rarity-v1.6")
          p.write_text(s)

          t=Path('test/drink-copy-coverage.test.mjs')
          if t.exists():
              ts=t.read_text().replace('assert.equal(master.length,50);','assert.equal(master.length,75);')
              t.write_text(ts)
          else:
              t.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nconst source=fs.readFileSync(new URL('../src/worker.mjs',import.meta.url),'utf8');\nfunction namesFromArray(constName){const marker=`const ${constName} = [`;const start=source.indexOf(marker);assert.notEqual(start,-1);const end=source.indexOf('];',start);return [...source.slice(start+marker.length,end).matchAll(/\\[\"([^\"]+)\"/g)].map(m=>m[1]);}\ntest('all 75 calibrated drinks have fixed D1 copy',()=>{const master=[...new Set(namesFromArray('DRINK_MASTER_SEED'))];const copy=new Set(namesFromArray('DRINK_COPY_SEED'));assert.equal(master.length,75);assert.deepEqual(master.filter(name=>!copy.has(name)),[]);});\n""")
          PY
      - name: Validate
        run: |
          node --check src/worker.mjs
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.mjs test/drink-copy-coverage.test.mjs
          git commit -m "Expand Japan drink master to 75 drinks"
          git push origin chatgpt/japan-rarity-v1-6-expand-75
