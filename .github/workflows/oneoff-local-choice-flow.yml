name: One-off local choice flow patch

on:
  push:
    branches:
      - perf/local-choice-flow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/local-choice-flow
      - name: Apply local choice flow patch
        run: python scripts/oneoff_patch_local_flow.py
      - name: Remove one-off files and commit
        run: |
          rm .github/workflows/oneoff-local-choice-flow.yml
          rm scripts/oneoff_patch_local_flow.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/main.js test/worker.test.mjs .github/workflows/oneoff-local-choice-flow.yml scripts/oneoff_patch_local_flow.py
          git commit -m "Make guided choice flow local until final recommendation"
          git push origin HEAD:perf/local-choice-flow
