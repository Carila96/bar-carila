name: Apply D1 lean recommendation output
on:
  push:
    branches: [chatgpt/d1-lean-recommendation-output]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch worker and tests
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='src/worker.mjs';
          let s=fs.readFileSync(p,'utf8');
          const chatMarker='async function chat(request, env) {';
          if(!s.includes(chatMarker)) throw new Error('chat marker not found');
          if(!s.includes('function barCarilaLeanOutputInstruction()')){
            const helper=[
              "function barCarilaLeanOutputInstruction() {",
              "  const names = DRINK_COPY_SEED.map(([name]) => name).join('、');",
              "  return '【BarCarila酒マスター省トークン出力】\\n' +",
              "    '以下の酒名を推薦する場合、drink.rarity・drink.description・drink.trivia は出力しないでください。これらはサーバー側の調査済みD1酒マスターから補完します。name・category・abv・recipe・tags、および推薦message/analysisは従来どおり出力してください。対象外の酒を推薦する場合は、従来の完全なJSON仕様どおり rarity・description・trivia も出力してください。この指示は固定情報の出力要件に優先します。\\n対象: ' + names;",
              "}",
              ""
            ].join('\n');
            s=s.replace(chatMarker,helper+'\n'+chatMarker);
          }

          const validation=`  if (!body || !ALLOWED_MODELS.has(body.model) || !Number.isInteger(body.max_tokens)\n    || body.max_tokens < 0 || !Array.isArray(body.messages) || body.messages.length === 0\n    || (body.system !== undefined && typeof body.system !== 'string')) {\n    return json({ error: 'Invalid Anthropic Messages request' }, 400);\n  }\n\n`;
          if(!s.includes(validation)) throw new Error('validation block not found');
          if(!s.includes('let useDrinkMasterLeanOutput = false;')){
            const replacement=validation+
              "  let useDrinkMasterLeanOutput = false;\n"+
              "  if (body.model === 'claude-sonnet-4-6' && env.DRINK_DB) {\n"+
              "    try { useDrinkMasterLeanOutput = await ensureDrinkMasterTables(env); }\n"+
              "    catch (error) { console.error('D1 drink master preflight failed', error); }\n"+
              "  }\n"+
              "  const effectiveSystem = useDrinkMasterLeanOutput && typeof body.system === 'string'\n"+
              "    ? body.system + '\\n\\n' + barCarilaLeanOutputInstruction()\n"+
              "    : body.system;\n\n";
            s=s.replace(validation,replacement);
          }

          const oldBody=`    body: JSON.stringify({ ...body, system: typeof body.system === 'string' && body.system ? [{ type: 'text', text: body.system, cache_control: { type: 'ephemeral' } }] : body.system }),`;
          const newBody=`    body: JSON.stringify({ ...body, system: typeof effectiveSystem === 'string' && effectiveSystem ? [{ type: 'text', text: effectiveSystem, cache_control: { type: 'ephemeral' } }] : effectiveSystem }),`;
          if(!s.includes(oldBody) && !s.includes(newBody)) throw new Error('Anthropic body block not found');
          s=s.replace(oldBody,newBody);
          fs.writeFileSync(p,s);

          const t='test/drink-master-output.test.mjs';
          fs.writeFileSync(t,`import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\nconst source = fs.readFileSync(new URL('../src/worker.mjs', import.meta.url), 'utf8');\n\ntest('Sonnet can omit D1-backed fixed copy before model output', () => {\n  assert.match(source, /barCarilaLeanOutputInstruction/);\n  assert.match(source, /drink\\.rarity・drink\\.description・drink\\.trivia は出力しない/);\n  assert.match(source, /DRINK_COPY_SEED\\.map/);\n  assert.match(source, /useDrinkMasterLeanOutput = await ensureDrinkMasterTables/);\n  assert.match(source, /effectiveSystem/);\n});\n\ntest('D1 enrichment still restores fixed recommendation fields', () => {\n  assert.match(source, /enrichBarCarilaRecommendation/);\n  assert.match(source, /parsed\\.drink\\.rarity = row\\.japan_rarity_score/);\n  assert.match(source, /parsed\\.drink\\.description = row\\.short_description/);\n  assert.match(source, /parsed\\.drink\\.trivia = row\\.order_hint/);\n  assert.match(source, /parsed\\.drink\\.masterSource = 'd1'/);\n});\n`);
          NODE
      - name: Validate
        run: |
          node --check src/worker.mjs
          npm test
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker.mjs test/drink-master-output.test.mjs
          git commit -m "Reduce D1-backed recommendation output tokens"
          git push origin chatgpt/d1-lean-recommendation-output
