name: One-off wire drink master batch 05
on:
  push:
    branches: [feat/drink-master-b05]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/drink-master-b05
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire batch 05 into runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/worker-v1.9.mjs')
          s=p.read_text()
          imp="import { DRINK_MASTER_EXPANSION_B05, DRINK_MASTER_EXPANSION_B05_SEED_ROWS, DRINK_MASTER_EXPANSION_B05_ALIAS_ENTRIES, DRINK_MASTER_EXPANSION_B05_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B05_EVALUATED_AT } from './drink-master-expansion-b05.mjs';\n"
          if 'drink-master-expansion-b05.mjs' not in s:
              marker="import { DRINK_MASTER_EXPANSION_B04, DRINK_MASTER_EXPANSION_B04_SEED_ROWS, DRINK_MASTER_EXPANSION_B04_ALIAS_ENTRIES, DRINK_MASTER_EXPANSION_B04_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B04_EVALUATED_AT } from './drink-master-expansion-b04.mjs';\n"
              if marker not in s: raise SystemExit('B04 import marker missing')
              s=s.replace(marker,marker+imp,1)
          s=s.replace('...DRINK_MASTER_EXPANSION_B04_SEED_ROWS].map', '...DRINK_MASTER_EXPANSION_B04_SEED_ROWS, ...DRINK_MASTER_EXPANSION_B05_SEED_ROWS].map',1)
          alias_marker="for (const [alias, masterKey] of DRINK_MASTER_EXPANSION_B04_ALIAS_ENTRIES) {\n  LOOKUP_ALIASES.set(normalizeDrinkV19Key(alias), normalizeDrinkV19Key(masterKey));\n}\n"
          if 'DRINK_MASTER_EXPANSION_B05_ALIAS_ENTRIES) {' not in s:
              if alias_marker not in s: raise SystemExit('B04 alias marker missing')
              s=s.replace(alias_marker,alias_marker+"for (const [alias, masterKey] of DRINK_MASTER_EXPANSION_B05_ALIAS_ENTRIES) {\n  LOOKUP_ALIASES.set(normalizeDrinkV19Key(alias), normalizeDrinkV19Key(masterKey));\n}\n",1)
          s=s.replace('DRINK_MASTER_EXPANSION_B04_EVIDENCE_VERSION]);','DRINK_MASTER_EXPANSION_B04_EVIDENCE_VERSION, DRINK_MASTER_EXPANSION_B05_EVIDENCE_VERSION]);',1)
          if 'async function hasExpansionB05Seed' not in s:
              start=s.index('async function hasExpansionB04Seed')
              end=s.index('async function seedV19IfNeeded',start)
              block=s[start:end].replace('B04','B05')
              s=s[:end]+block+s[end:]
          s=s.replace('  if (!(await hasExpansionB04Seed(env))) await seedExpansionB04(env);\n}', '  if (!(await hasExpansionB04Seed(env))) await seedExpansionB04(env);\n  if (!(await hasExpansionB05Seed(env))) await seedExpansionB05(env);\n}',1)
          s=s.replace('hasExpansionB03Seed, hasExpansionB04Seed };','hasExpansionB03Seed, hasExpansionB04Seed, hasExpansionB05Seed };',1)
          p.write_text(s)
          PY
      - run: npm test
      - run: npm run validate:drink-master-v1.9
      - name: Commit wiring and remove one-off workflow
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-wire-b05.yml
          git add -A
          git commit -m 'Wire known drink master batch 05' || true
          git push origin HEAD:feat/drink-master-b05 || true
