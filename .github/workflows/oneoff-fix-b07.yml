name: One-off fix drink master batch 07
on:
  push:
    branches: [auto/drink-master-b07]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto/drink-master-b07
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Remove normalized self aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/drink-master-expansion-b07.mjs')
          s=p.read_text()
          old="masterKey: 'Gin Gin Mule', nameJa: 'ジン・ジン・ミュール', aliases: ['Gin-Gin Mule','ジンジンミュール'],"
          new="masterKey: 'Gin Gin Mule', nameJa: 'ジン・ジン・ミュール', aliases: [],"
          if old not in s: raise SystemExit('alias marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm test
      - run: npm run validate:drink-master-v1.9
      - name: Commit clean fix
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-fix-b07.yml
          git add -A
          git commit -m 'Fix batch 07 normalized aliases' || true
          git push origin HEAD:auto/drink-master-b07 || true
