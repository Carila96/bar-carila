name: One-shot initial render speed

on:
  push:
    branches:
      - chatgpt/initial-render-speed

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[generated-render-speed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply initial-render optimizations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          p = Path('public/index.html')
          s = p.read_text()
          s = s.replace('<script async src="https://www.googletagmanager.com/gtag/js?id=G-124MM8RN7Z"></script>\n<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag(\'js\',new Date());gtag(\'config\',\'G-124MM8RN7Z\');</script>\n', '')
          font = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Noto+Serif+JP:wght@200;300;400&display=swap">'
          async_font = '<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Noto+Serif+JP:wght@200;300;400&display=swap" onload="this.onload=null;this.rel=\'stylesheet\'">\n<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Noto+Serif+JP:wght@200;300;400&display=swap"></noscript>'
          if font not in s: raise SystemExit('font stylesheet marker not found')
          s = s.replace(font, async_font, 1)
          bg_preload = '<link rel="preload" as="image" href="/assets/images/bar-background.webp" fetchpriority="high">'
          s = s.replace(bg_preload, bg_preload + '\n<link rel="preload" as="image" href="/pandas/p-counter.png" fetchpriority="high">', 1)
          replacements = {
            '<img class="panda-img active" id="p-counter"    src="/pandas/p-counter.png"    alt="" style="mix-blend-mode:multiply;">': '<img class="panda-img active" id="p-counter" src="/pandas/p-counter.png" alt="" fetchpriority="high" decoding="async" style="mix-blend-mode:multiply;">',
            '<img class="panda-img"        id="p-loading"    src="/pandas/p-loading.png"    alt="" style="mix-blend-mode:multiply;">': '<img class="panda-img" id="p-loading" data-src="/pandas/p-loading.png" alt="" decoding="async" style="mix-blend-mode:multiply;">',
            '<img class="panda-img"        id="p-think"      src="/pandas/p-think.png"      alt="" style="mix-blend-mode:multiply;">': '<img class="panda-img" id="p-think" data-src="/pandas/p-think.png" alt="" decoding="async" style="mix-blend-mode:multiply;">',
            '<img class="panda-img"        id="p-smile"      src="/pandas/p-approve.png"    alt="" style="mix-blend-mode:multiply;">': '<img class="panda-img" id="p-smile" data-src="/pandas/p-approve.png" alt="" decoding="async" style="mix-blend-mode:multiply;">',
            '<img class="panda-img"        id="p-approve"    src="/pandas/p-approve.png"    alt="" style="mix-blend-mode:multiply;">': '<img class="panda-img" id="p-approve" data-src="/pandas/p-approve.png" alt="" decoding="async" style="mix-blend-mode:multiply;">',
            '<img class="panda-img"        id="p-sad"        src="/pandas/p-sad.png"        alt="" style="mix-blend-mode:multiply;">': '<img class="panda-img" id="p-sad" data-src="/pandas/p-sad.png" alt="" decoding="async" style="mix-blend-mode:multiply;">',
            '<img class="panda-img"        id="p-curious"    src="/pandas/p-curious.png"    alt="" style="mix-blend-mode:multiply;">': '<img class="panda-img" id="p-curious" data-src="/pandas/p-curious.png" alt="" decoding="async" style="mix-blend-mode:multiply;">',
            '<img class="panda-img"        id="p-relax"      src="/pandas/p-relax.png"      alt="" style="mix-blend-mode:multiply;">': '<img class="panda-img" id="p-relax" data-src="/pandas/p-relax.png" alt="" decoding="async" style="mix-blend-mode:multiply;">',
            '<img class="panda-img"        id="p-bartender"  src="/pandas/p-bartender.png"  alt="" style="mix-blend-mode:multiply;">': '<img class="panda-img" id="p-bartender" data-src="/pandas/p-bartender.png" alt="" decoding="async" style="mix-blend-mode:multiply;">',
          }
          for old, new in replacements.items():
              if old not in s: raise SystemExit('panda marker not found: ' + old[:55])
              s = s.replace(old, new, 1)
          s = s.replace('<button class="logo-btn" onclick="goHome()"><img src="/pandas/logo.png" alt="">', '<button class="logo-btn" onclick="goHome()"><img src="/pandas/logo.png" alt="" decoding="async">', 1)
          marker = '<script src="/assets/js/main.js" defer></script>'
          runtime = '''<script>
          (()=>{
            const loadPanda=(img)=>{if(img?.dataset?.src&&!img.src){img.src=img.dataset.src;delete img.dataset.src;}};
            const stage=document.getElementById('pandaStage');
            if(stage)new MutationObserver(records=>{for(const record of records){const img=record.target;if(img.classList?.contains('panda-img')&&img.classList.contains('active'))loadPanda(img);}}).observe(stage,{subtree:true,attributes:true,attributeFilter:['class']});
            const loadAnalytics=()=>{window.dataLayer=window.dataLayer||[];window.gtag=window.gtag||function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config','G-124MM8RN7Z');const script=document.createElement('script');script.async=true;script.src='https://www.googletagmanager.com/gtag/js?id=G-124MM8RN7Z';document.head.appendChild(script);};
            if('requestIdleCallback' in window)requestIdleCallback(loadAnalytics,{timeout:2500});else addEventListener('load',()=>setTimeout(loadAnalytics,500),{once:true});
          })();
          </script>
          ''' + marker
          if marker not in s: raise SystemExit('main.js marker not found')
          s = s.replace(marker, runtime, 1)
          p.write_text(s)

          p = Path('src/worker.mjs')
          s = p.read_text()
          start = s.index('function optimizeBarCarilaHtml(response) {')
          end = s.index('\nasync function chat(', start)
          s = s[:start] + s[end+1:]
          s = s.replace("      let response = await env.ASSETS.fetch(request);\n      if (request.method === 'GET' && (pathname === '/' || pathname === '/index.html')) {\n        response = optimizeBarCarilaHtml(response);\n      }\n      return cacheStaticAsset(response, pathname);", "      const response = await env.ASSETS.fetch(request);\n      return cacheStaticAsset(response, pathname);")
          p.write_text(s)

          p = Path('wrangler.jsonc')
          cfg = json.loads(p.read_text())
          cfg['assets']['run_worker_first'] = ['/api/*', '/health', '/carila']
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Validate
        run: |
          npm test
          node --check src/worker.mjs
          node --check public/assets/js/main.js
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-initial-render-speed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize BarCarila initial render [generated-render-speed]"
          git push
