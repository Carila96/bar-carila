name: One-off drink master expansion batch 01
on:
  push:
    branches: [data/drink-master-expansion-b01]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/drink-master-expansion-b01
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Integrate additive expansion layer
        run: python scripts/patch-drink-master-expansion-b01.py
      - run: npm test
      - run: npm run validate:drink-master-v1.9
      - name: Commit clean expansion batch
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-drink-master-expansion-b01.yml scripts/patch-drink-master-expansion-b01.py
          git add -A
          git commit -m 'Integrate researched drink master expansion batch 01' || true
          git push origin HEAD:data/drink-master-expansion-b01 || true
