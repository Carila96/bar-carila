name: B36 validation
on:
  push:
    branches: [automation/drink-master-b36]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate:drink-master-v1.9
