name: Inspect conversation speed paths
on:
  push:
    branches: [chatgpt/conversation-speed]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show chat call sites and startup logic
        run: |
          echo '--- fetch(API) call sites ---'
          grep -n -B 20 -A 35 "fetch(API" public/assets/js/main.js || true
          echo '--- panda setters ---'
          grep -n -B 8 -A 20 "panda" public/assets/js/main.js | head -n 260 || true
          echo '--- startup tail ---'
          tail -n 220 public/assets/js/main.js
