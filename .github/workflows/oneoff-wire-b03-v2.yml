name: Wire drink master batch 03 v2
on: [push]
permissions:
  contents: write
jobs:
  wire:
    if: github.ref == 'refs/heads/data/drink-master-expansion-b03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/drink-master-expansion-b03
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/wire-b03.py
      - run: npm test
      - run: npm run validate:drink-master-v1.9
      - name: Commit clean batch 03
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-wire-b03.yml .github/workflows/oneoff-wire-b03-v2.yml scripts/wire-b03.py
          git add -A
          git commit -m 'Wire drink master expansion batch 03' || true
          git push origin HEAD:data/drink-master-expansion-b03 || true
