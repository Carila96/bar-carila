export const DRINK_MASTER_EXPANSION_B04_SEED_ROWS = DRINK_MASTER_EXPANSION_B04.map((drink) => [
  drink.masterKey,
  drink.availability,
  drink.rarity,
  drink.confidence,
]);

export const DRINK_MASTER_EXPANSION_B04_ALIAS_ENTRIES = DRINK_MASTER_EXPANSION_B04.flatMap((drink) =>
  [drink.nameJa, ...drink.aliases].map((alias) => [alias, drink.masterKey])
);
