name: One-off expand drink master batch 04
on:
  push:
    branches:
      - expand/drink-master-b04
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: expand/drink-master-b04
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire batch 04 runtime
        run: python scripts/wire-b04.py
      - run: npm test
      - run: npm run validate:drink-master-v1.9
      - name: Commit clean batch
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-expand-drink-master-b04.yml scripts/wire-b04.py
          git add -A
          git commit -m 'Wire known drink master batch 04' || true
          git push origin HEAD:expand/drink-master-b04 || true
