name: One-shot drink image cache
on:
  push:
    branches:
      - chatgpt/drink-image-cache
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch-drink-image-cache.py
      - run: npm test
      - run: node --check public/assets/js/main.js
      - run: node --check src/worker.mjs
      - name: Commit generated optimization
        run: |
          rm -f .github/workflows/inspect-drink-image-cache.yml .github/workflows/one-shot-drink-image-cache.yml scripts/patch-drink-image-cache.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cache drink images across recommendations [generated-drink-image-cache]"
          git push
