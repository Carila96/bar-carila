name: One-shot drink image cache
on:
  push:
    branches: [chatgpt/drink-image-cache]
permissions:
  contents: write
jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, '[generated-drink-image-cache]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Patch image lookup/cache flow
        run: |
          python - <<'PY'
          from pathlib import Path
          js_path=Path('public/assets/js/main.js')
          js=js_path.read_text()
          old="""function getDrinkImg(name,cat){
  const norm=s=>(s||'').toLowerCase().replace(/[・\\s.\\-]/g,'');
  const nName=norm(name);
  const keys=Object.keys(DRINK_IMGS).sort((a,b)=>b.length-a.length);
  for(const k of keys){if(nName.includes(norm(k)))return DRINK_IMGS[k];}
  if(cat&&CAT_IMGS[cat])return CAT_IMGS[cat];
  return pickRandom(FALLBACK_IMGS);
}
function buildImgQuery(cat){"""
          new="""const DRINK_IMG_CACHE_KEY='bar_carila_drink_img_cache_v1';
function normDrinkName(s){return (s||'').toLowerCase().replace(/[・\\s.\\-]/g,'');}
function findStaticDrinkImg(name){
  const nName=normDrinkName(name);
  const keys=Object.keys(DRINK_IMGS).sort((a,b)=>b.length-a.length);
  for(const k of keys){if(nName.includes(normDrinkName(k)))return DRINK_IMGS[k];}
  return null;
}
function readDrinkImgCache(){try{return JSON.parse(localStorage.getItem(DRINK_IMG_CACHE_KEY)||'{}')}catch{return{}}}
function getCachedDrinkImg(name){
  const entry=readDrinkImgCache()[normDrinkName(name)];
  return entry&&typeof entry.url==='string'&&entry.url?entry:null;
}
function saveDrinkImgCache(name,data){
  if(!name||!data||typeof data.url!=='string'||!data.url)return;
  try{
    const cache=readDrinkImgCache();
    cache[normDrinkName(name)]={url:data.url,photoId:data.photoId||'',photographer:data.photographer||'',photographerUrl:data.photographerUrl||'',savedAt:Date.now()};
    const entries=Object.entries(cache).sort((a,b)=>(b[1].savedAt||0)-(a[1].savedAt||0)).slice(0,250);
    localStorage.setItem(DRINK_IMG_CACHE_KEY,JSON.stringify(Object.fromEntries(entries)));
  }catch{}
}
function getDrinkImg(name,cat){
  const fixed=findStaticDrinkImg(name);
  if(fixed)return fixed;
  const cached=getCachedDrinkImg(name);
  if(cached)return cached.url;
  if(cat&&CAT_IMGS[cat])return CAT_IMGS[cat];
  return pickRandom(FALLBACK_IMGS);
}
function buildImgQuery(cat){"""
          if old not in js: raise SystemExit('getDrinkImg block not found')
          js=js.replace(old,new)
          old_fetch="""async function fetchDrinkImg(name,cat,imgEl){
  try{
    const q=buildImgQuery(cat);
    const r=await fetch(`/api/drink-image?name=${encodeURIComponent(name)}&query=${encodeURIComponent(q)}`);
    const d=await r.json();
    if(d.url&&imgEl&&imgEl.src!==d.url)imgEl.src=d.url;
  }catch(e){}
}"""
          new_fetch="""async function fetchDrinkImg(name,cat,imgEl){
  if(findStaticDrinkImg(name))return;
  const cached=getCachedDrinkImg(name);
  if(cached){if(imgEl&&imgEl.src!==cached.url)imgEl.src=cached.url;return;}
  try{
    const q=buildImgQuery(cat);
    const r=await fetch(`/api/drink-image?name=${encodeURIComponent(name)}&query=${encodeURIComponent(q)}`);
    if(!r.ok)return;
    const d=await r.json();
    if(d.url){saveDrinkImgCache(name,d);if(imgEl&&imgEl.src!==d.url)imgEl.src=d.url;}
  }catch(e){}
}"""
          if old_fetch not in js: raise SystemExit('fetchDrinkImg block not found')
          js=js.replace(old_fetch,new_fetch)
          js_path.write_text(js)

          worker_path=Path('src/worker.mjs')
          worker=worker_path.read_text()
          old_worker="""  const cache = caches.default;
  const cacheKey = new Request(url.toString(), { method: 'GET' });
  const cached = await cache.match(cacheKey);
  if (cached) return cached;

  const params = new URLSearchParams({
    query: query || `${name} cocktail drink`,
    per_page: '3',
    orientation: 'landscape',
  });"""
          new_worker="""  const cache = caches.default;
  const normalize = (value) => (value || '').trim().toLowerCase().replace(/[・\\s.\\-]/g, '');
  const cacheIdentity = normalize(name) || normalize(query);
  const cacheUrl = new URL('/api/drink-image', url.origin);
  cacheUrl.searchParams.set('key', cacheIdentity);
  const cacheKey = new Request(cacheUrl.toString(), { method: 'GET' });
  const cached = await cache.match(cacheKey);
  if (cached) return cached;

  const params = new URLSearchParams({
    query: query || `${name} cocktail drink`,
    per_page: '3',
    orientation: 'landscape',
  });"""
          if old_worker not in worker: raise SystemExit('worker cache block not found')
          worker=worker.replace(old_worker,new_worker)
          old_result="""  const data = await upstream.json();
  const rawUrl = data.results?.[0]?.urls?.regular;
  const imageUrl = rawUrl ? `${rawUrl.split('?')[0]}?w=800&auto=format&fit=crop` : null;
  const response = json({ url: imageUrl }, 200, { 'cache-control': 'public, max-age=86400' });
  context.waitUntil(cache.put(cacheKey, response.clone()));
  return response;"""
          new_result="""  const data = await upstream.json();
  const photo = data.results?.[0];
  const rawUrl = photo?.urls?.regular;
  const imageUrl = rawUrl ? `${rawUrl.split('?')[0]}?w=800&auto=format&fit=crop` : null;
  const ttl = imageUrl ? 31536000 : 2592000;
  const response = json({
    url: imageUrl,
    photoId: photo?.id || '',
    photographer: photo?.user?.name || '',
    photographerUrl: photo?.user?.links?.html || '',
  }, 200, { 'cache-control': `public, max-age=${ttl}, stale-while-revalidate=604800` });
  context.waitUntil(cache.put(cacheKey, response.clone()));
  return response;"""
          if old_result not in worker: raise SystemExit('worker result block not found')
          worker=worker.replace(old_result,new_result)
          worker_path.write_text(worker)

          test_path=Path('test/worker.test.mjs')
          test=test_path.read_text()
          test += """

test('drink image client prefers fixed and locally cached images before API search', async () => {
  const js = await readFile(new URL('../public/assets/js/main.js', import.meta.url), 'utf8');
  assert.match(js, /const DRINK_IMG_CACHE_KEY='bar_carila_drink_img_cache_v1'/);
  assert.match(js, /if\(findStaticDrinkImg\(name\)\)return;/);
  assert.match(js, /const cached=getCachedDrinkImg\(name\);/);
  assert.match(js, /saveDrinkImgCache\(name,d\)/);
});

test('drink image API uses normalized long-lived cache keys', async () => {
  const source = await readFile(new URL('../src/worker.mjs', import.meta.url), 'utf8');
  assert.match(source, /cacheUrl\.searchParams\.set\('key', cacheIdentity\)/);
  assert.match(source, /const ttl = imageUrl \? 31536000 : 2592000/);
  assert.match(source, /photoId: photo\?\.id \|\| ''/);
  assert.match(source, /photographer: photo\?\.user\?\.name \|\| ''/);
});
"""
          test_path.write_text(test)
          PY
      - run: npm test
      - run: node --check public/assets/js/main.js
      - run: node --check src/worker.mjs
      - name: Remove temporary files and commit
        run: |
          rm -f .github/workflows/inspect-drink-image-cache.yml .github/workflows/one-shot-drink-image-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cache drink images across recommendations [generated-drink-image-cache]"
          git push
