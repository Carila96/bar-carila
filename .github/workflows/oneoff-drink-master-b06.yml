name: One-off drink master batch 06
on:
  push:
    branches: [data/drink-master-expansion-b06]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/drink-master-expansion-b06
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/patch-drink-master-b06.py
      - run: npm test
      - run: npm run validate:drink-master-v1.9
      - name: Commit clean batch 06
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/oneoff-drink-master-b06.yml scripts/patch-drink-master-b06.py
          git add -A
          git commit -m 'Wire drink master expansion batch 06' || true
          git push origin HEAD:data/drink-master-expansion-b06 || true
